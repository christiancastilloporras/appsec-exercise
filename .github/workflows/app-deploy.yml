name: App Build and Deploy

on:
  # Manual trigger only
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag (default: git commit SHA)'
        required: false
      deploy_reason:
        description: 'Reason for deployment'
        required: false
        default: 'Manual deployment'

# Permissions required for artifact uploads
permissions:
  contents: read
  packages: write

env:
  RESOURCE_GROUP: appsec-exercise-rg
  AKS_CLUSTER_NAME: appsec-aks-cluster
  ACR_NAME: PLACEHOLDER_ACR
  TF_VERSION: 1.5.7

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set Image Tag
      run: |
        if [ -z "${{ github.event.inputs.image_tag }}" ]; then
          echo "IMAGE_TAG=${GITHUB_SHA::8}" >> $GITHUB_ENV
        else
          echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_ENV
        fi

    - name: Install Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Validate Azure Separate Secrets
      run: |
        for secret_name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_CLIENT_SECRET; do
          if [ -z "${!secret_name}" ]; then
            echo "ERROR: $secret_name secret is not set or empty" >&2
            exit 1
          fi
        done
        echo "All Azure login secrets validated"
      env:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

    - name: Build creds JSON from separated secrets
      id: build_creds
      env:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      run: |
        cat > "$GITHUB_OUTPUT" <<EOF
        creds_json={"clientId":"${AZURE_CLIENT_ID}","clientSecret":"${AZURE_CLIENT_SECRET}","tenantId":"${AZURE_TENANT_ID}","subscriptionId":"${AZURE_SUBSCRIPTION_ID}","activeDirectoryAppIdUrl":"https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/authorize","activeDirectoryGraphResourceId":"https://graph.windows.net/","activeDirectoryServiceEndpointResourceId":"https://management.azure.com/"}
        EOF

    - name: Azure Login
      uses: azure/login@v3
      with:
        creds: ${{ steps.build_creds.outputs.creds_json }}

    - name: Authorize GitHub Actions Runner IP for AKS API
      run: |
        RUNNER_IP=$(curl -s https://api.ipify.org)
        echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV

        # Get current authorized IP ranges to preserve them
        CURRENT_IPS=$(az aks show \
          --resource-group "$RESOURCE_GROUP" \
          --name "$AKS_CLUSTER_NAME" \
          --query "apiServerAccessProfiles[0].authorizedIPRanges" -o tsv 2>/dev/null || echo "")

        USER_IP="177.245.192.41/32"
        echo "Current authorized IPs: $CURRENT_IPS"
        echo "User IP: $USER_IP"
        echo "Runner IP: $RUNNER_IP/32"

        # Combine: user IP + runner IP (preserve user access)
        COMBINED_IPS="$USER_IP,$RUNNER_IP/32"
        echo "Setting authorized IPs to: $COMBINED_IPS"

        az aks update \
          --resource-group "$RESOURCE_GROUP" \
          --name "$AKS_CLUSTER_NAME" \
          --api-server-authorized-ip-ranges "$COMBINED_IPS"

    - name: Set AWS Credentials for RustFS S3 Backend
      run: |
        echo "Setting AWS credentials for RustFS S3 backend"
        echo "AWS_ACCESS_KEY_ID=${{ secrets.RUST_FS_ACCESS }}" >> $GITHUB_ENV
        echo "AWS_SECRET_ACCESS_KEY=${{ secrets.RUST_FS_SECRET }}" >> $GITHUB_ENV
        echo "AWS_ENDPOINT=${{ secrets.RUST_FS_FQDN }}" >> $GITHUB_ENV

    - name: Test RustFS S3 Backend Connectivity
      run: |
        echo "Installing awscli for S3 backend connectivity test..."
        pip install --quiet awscli
        # AWS_ENDPOINT already contains the full URL (e.g. https://s3.cloudguardian.xyz)
        # Strip protocol to get the bare host, then let awscli add https:// back
        S3_HOST=$(echo "$AWS_ENDPOINT" | sed 's|https://||;s|http://||')
        echo "Testing S3 connectivity to RustFS at https://$S3_HOST ..."
        # Test bucket listing (validates credentials, endpoint, and SigV4 signing)
        # Do NOT use 'set -e' here so we can capture the exit code and report a helpful error
        set +e
        aws --endpoint-url "https://$S3_HOST" \
          --region us-east-1 \
          s3 ls "s3://tfstate" 2>&1
        LIST_EXIT=$?
        if [ $LIST_EXIT -ne 0 ]; then
          echo "ERROR: RustFS S3 backend connectivity test failed (exit code: $LIST_EXIT)"
          echo "This means terraform init will also fail. Check:"
          echo "  - RUST_FS_FQDN is correct and reachable"
          echo "  - RUST_FS_ACCESS and RUST_FS_SECRET are valid"
          echo "  - The 'tfstate' bucket exists on the RustFS instance"
          exit 1
        fi
        echo "RustFS S3 backend connectivity test passed. Bucket 'tfstate' is accessible."

    - name: Terraform Init
      run: |
        cd terraform
        terraform init -input=false

    - name: Get Terraform Outputs
      run: |
        cd terraform
        echo "MONGO_IP=$(terraform output -raw mongo_vm_private_ip)" >> $GITHUB_ENV
        echo "MONGO_ADMIN_PASSWORD=$(terraform output -raw mongo_admin_password)" >> $GITHUB_ENV
        echo "ACR_NAME=$(terraform output -raw acr_login_server | cut -d'.' -f1)" >> $GITHUB_ENV
        echo "ACR_USERNAME=$(terraform output -raw acr_username)" >> $GITHUB_ENV
        echo "ACR_PASSWORD=$(terraform output -raw acr_password)" >> $GITHUB_ENV
        echo "AKS_SUBNET_ID=$(terraform output -raw aks_subnet_id)" >> $GITHUB_ENV
        mkdir -p $HOME/.kube
        terraform output -raw aks_kube_config > $HOME/.kube/config
        echo "Kubeconfig written to $HOME/.kube/config"

    - name: Install kubectl
      uses: azure/setup-kubectl@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Allow AKS Subnet and GitHub Actions Runner IP on ACR
      run: |
        if [ -z "$RUNNER_IP" ]; then
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
        fi
        
        echo "Current Runner IP: $RUNNER_IP"
        
        echo "Adding ACR firewall rule for AKS subnet: $AKS_SUBNET_ID"
        az acr network-rule add \
          --name "$ACR_NAME" \
          --resource-group "$RESOURCE_GROUP" \
          --subnet "$AKS_SUBNET_ID" \
          --subscription "$AZURE_SUBSCRIPTION_ID"
          
        echo "Adding temporary ACR firewall rule for $RUNNER_IP"
        az acr network-rule add \
          --name "$ACR_NAME" \
          --resource-group "$RESOURCE_GROUP" \
          --ip-address "$RUNNER_IP" \
          --subscription "$AZURE_SUBSCRIPTION_ID"
          
        echo "Waiting for firewall rule propagation..."
        # Propagation can take up to several minutes. 
        # We poll the API to confirm the rule is registered before attempting login.
        MAX_RETRIES=15
        COUNT=0
        while [ $COUNT -lt $MAX_RETRIES ]; do
          if az acr network-rule list --name "$ACR_NAME" --resource-group "$RESOURCE_GROUP" --query "[?ipAddress=='$RUNNER_IP'].ipAddress" -o tsv | grep -q "$RUNNER_IP"; then
            echo "✅ Rule verified as active in Azure API."
            break
          fi
          echo "Retry $((COUNT+1))/$MAX_RETRIES: Rule not yet visible..."
          sleep 10
          COUNT=$((COUNT+1))
        done
        
        # Even after the API shows the rule, the data plane may take a few more seconds.
        sleep 10
      env:
        AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Login to ACR
      run: |
        echo "${{ env.ACR_PASSWORD }}" | docker login ${{ env.ACR_NAME }}.azurecr.io \
          -u ${{ env.ACR_USERNAME }} \
          --password-stdin

    - name: Build and Push Docker Image
      run: |
        IMAGE_TAG="${{ env.IMAGE_TAG }}"
        ACR_FULL="${{ env.ACR_NAME }}.azurecr.io"
        FULL_IMAGE="$ACR_FULL/appsec-exercise:$IMAGE_TAG"
        docker build -t "$FULL_IMAGE" .
        docker push "$FULL_IMAGE"
        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
        echo "IMAGE_FULL=$FULL_IMAGE" >> $GITHUB_ENV

    - name: Run Cortex Container Image Scan (non-blocking)
      continue-on-error: true
      uses: PaloAltoNetworks/cortex-cloud-scan@v1
      with:
        scan-type: image
        api-base-url: ${{ secrets.CORTEX_API_BASE_URL }}
        api-key: ${{ secrets.CORTEX_API_KEY }}
        api-key-id: ${{ secrets.CORTEX_API_KEY_ID }}
        image: '${{ env.ACR_NAME }}.azurecr.io/appsec-exercise:${{ env.IMAGE_TAG }}'
        ci-pipeline-id: ${{ github.run_id }}
        ci-build-id: ${{ github.run_number }}
        image-output-format: human-readable
        output-format: cli
        output-file-path: cortex-image-results.json
        soft-fail: true

    - name: Upload Cortex Scan Results
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: cortex-scan-results
        path: |
          cortex-image-results.json
        retention-days: 5

    - name: Deploy ACR Secret to Kubernetes
      run: |
        DOCKER_CONFIG=$(echo "{\"auths\":{\"${{ env.ACR_NAME }}.azurecr.io\":{\"username\":\"${{ env.ACR_USERNAME }}\",\"password\":\"${{ env.ACR_PASSWORD }}\",\"email\":\"\",\"server\":\"${{ env.ACR_NAME }}.azurecr.io\"}}}" | base64 -w 0)
        cat > /tmp/registry-secret.yaml << 'EOF'
        apiVersion: v1
        kind: Secret
        metadata:
          name: acr-secret
        data:
          .dockerconfigjson: PLACEHOLDER_DOCKER_CONFIG
        type: kubernetes.io/dockerconfigjson
        EOF
        sed "s|PLACEHOLDER_DOCKER_CONFIG|$DOCKER_CONFIG|g" /tmp/registry-secret.yaml | kubectl apply -f -

    - name: Update ConfigMap with Mongo IP
      run: |
        kubectl create configmap appsec-app-config \
          --from-literal=MONGO_IP="${{ env.MONGO_IP }}" \
          --from-literal=MONGO_URI="mongodb://admin:${{ env.MONGO_ADMIN_PASSWORD }}@${{ env.MONGO_IP }}:27017/admin-app?authSource=admin" \
          --from-literal=SECRET_KEY="appsec-secret-key" \
          --from-literal=MONGO_ADMIN_PASSWORD="${{ env.MONGO_ADMIN_PASSWORD }}" \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Create TLS Secret from Cloudflare Origin CA (if available)
      env:
        CF_ORIGIN_CA_CERT: ${{ secrets.CF_ORIGIN_CA_CERT }}
        CF_ORIGIN_CA_KEY: ${{ secrets.CF_ORIGIN_CA_KEY }}
      run: |
        if [ -n "$CF_ORIGIN_CA_CERT" ] && [ -n "$CF_ORIGIN_CA_KEY" ]; then
          echo "Creating TLS Secret from Cloudflare Origin CA certificate..."
          if echo "$CF_ORIGIN_CA_CERT" | grep -q 'BEGIN CERTIFICATE'; then
            printf '%s\n' "$CF_ORIGIN_CA_CERT" > /tmp/origin-cert.pem
            printf '%s\n' "$CF_ORIGIN_CA_KEY" > /tmp/origin-key.pem
          else
            echo "$CF_ORIGIN_CA_CERT" | base64 -d > /tmp/origin-cert.pem
            echo "$CF_ORIGIN_CA_KEY" | base64 -d > /tmp/origin-key.pem
          fi
          kubectl create secret tls tls-origin-cert \
            --cert=/tmp/origin-cert.pem \
            --key=/tmp/origin-key.pem \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "TLS Secret 'tls-origin-cert' created"
        else
          echo "Cloudflare Origin CA secrets not found - deploying without TLS"
        fi

    - name: Deploy K8s Manifests
      run: |
        sed "s|PLACEHOLDER_ACR|${{ env.ACR_NAME }}|g; s|PLACEHOLDER_TAG|${{ env.IMAGE_TAG }}|g; s|MONGO_IP_PLACEHOLDER|${{ env.MONGO_IP }}|g" k8s/deployment.yaml | kubectl apply -f -
        sed "s|MONGO_IP_PLACEHOLDER|${{ env.MONGO_IP }}|g" k8s/seed-script.yaml | kubectl apply -f -
        kubectl apply -f k8s/service.yaml
        kubectl apply -f k8s/ingress.yaml
        kubectl apply -f k8s/service-account.yaml
        kubectl apply -f k8s/cluster-role-binding.yaml
        kubectl apply -f k8s/secrets.yaml

    - name: Patch Ingress with TLS (if secret exists)
      if: always()
      run: |
        if kubectl get secret tls-origin-cert -n default > /dev/null 2>&1; then
          echo "Patching ingress with TLS configuration..."
          kubectl patch ingress appsec-exercise-ingress --type='merge' -p='{
            "spec": {
              "tls": [
                {
                  "hosts": ["app.cloudguardian.xyz"],
                  "secretName": "tls-origin-cert"
                }
              ]
            }
          }'
          echo "Ingress TLS configuration applied"
        else
          echo "TLS Secret not found - ingress will serve HTTP only"
        fi

    - name: Wait for LoadBalancer IP and Create Cloudflare DNS Record
      if: always()
      env:
        CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      run: |
        # Debug: Show all services and ingresses
        echo "=== Debug: All Services ==="
        kubectl get svc -A -o wide || true
        echo "=== Debug: Ingresses ==="
        kubectl get ingress -A -o wide || true
        
        # Wait for the LoadBalancer to get an external IP
        echo "Waiting for LoadBalancer external IP..."
        TIMEOUT=300
        INTERVAL=15
        ELAPSED=0

        while [ $ELAPSED -lt $TIMEOUT ]; do
          # For AKS Application Routing (webapprouting), the external IP is on the ingress
          LB_IP=$(kubectl get ingress appsec-exercise-ingress -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
          if [ -z "$LB_IP" ]; then
            # Fallback: check services in app-routing-system namespace for LoadBalancer
            # The exact service name may vary depending on AKS version
            for svc_name in "external-nginx" "nginx" "controller" "ingress-nginx-controller"; do
              LB_IP=$(kubectl get svc "$svc_name" -n app-routing-system -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
              if [ -n "$LB_IP" ] && [ "$LB_IP" != "<none>" ]; then
                echo "Found LB IP from service $svc_name"
                break
              fi
            done
          fi
          if [ -n "$LB_IP" ] && [ "$LB_IP" != "<none>" ]; then
            echo "LoadBalancer IP found: $LB_IP"
            echo "LB_IP=$LB_IP" >> $GITHUB_ENV
            break
          fi
          echo "Waiting for LoadBalancer IP... ($ELAPSED/${TIMEOUT}s)"
          sleep $INTERVAL
          ELAPSED=$((ELAPSED + INTERVAL))
        done

        if [ -z "$LB_IP" ] || [ "$LB_IP" = "<none>" ]; then
          echo "ERROR: LoadBalancer IP not assigned within timeout"
          kubectl get ingress appsec-exercise-ingress -o wide
          kubectl get svc -n app-routing-system -o wide
          exit 1
        fi

        # Check if DNS record already exists (idempotent)
        # Get ALL existing records for app.cloudguardian.xyz and delete duplicates
        ALL_RECORDS=$(curl -s "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records?type=A&name=app" \
                  -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json")

        RECORD_COUNT=$(echo "$ALL_RECORDS" | python3 -c "import sys,json; data=json.load(sys.stdin); print(len(data.get('result', [])))" 2>/dev/null || echo "0")

        if [ "$RECORD_COUNT" -gt 0 ]; then
          echo "Found $RECORD_COUNT existing A record(s) for app.$CF_ZONE_ID"
          # Delete all existing records first (cleanup)
          RECORD_IDS=$(echo "$ALL_RECORDS" | python3 -c "import sys,json; data=json.load(sys.stdin); print(' '.join([r['id'] for r in data.get('result', [])]))" 2>/dev/null)
          for RECORD_ID in $RECORD_IDS; do
            echo "Deleting old record: $RECORD_ID"
            curl -s -X DELETE "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records/$RECORD_ID" \
              -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" > /dev/null
          done
          sleep 2  # Brief delay for propagation
        fi

        # Create fresh DNS record
        echo "Creating new DNS record for app.cloudguardian.xyz -> $LB_IP"
        curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records" \
          -H "Authorization: Bearer $CF_API_TOKEN" \
          -H "Content-Type: application/json" \
          --data "{\"type\":\"A\",\"name\":\"app\",\"content\":\"${LB_IP}\",\"ttl\":1,\"proxied\":true}"
        echo ""
        echo "DNS record 'app.cloudguardian.xyz' created pointing to $LB_IP"

    - name: Verify Deployment
      run: |
        kubectl rollout status deployment/appsec-exercise-app --timeout=120s
        kubectl get pods -o wide
        kubectl get services
        kubectl get ingress
        
        # Wait a bit for the ingress to pick up new pods
        echo "Waiting for app to be ready..."
        sleep 10
        
        # Test app via service directly (bypasses ingress for troubleshooting)
        echo "=== Testing via port-forward ==="
        kubectl port-forward svc/appsec-exercise-service 8080:80 &
        PORT_FORWARD_PID=$!
        sleep 5
        curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" http://localhost:8080/ || echo "Port-forward test failed"
        curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" http://localhost:8080/login || echo "Login page test failed"
        curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" http://localhost:8080/api/status || echo "API status test failed"
        kill $PORT_FORWARD_PID 2>/dev/null || true
        
        echo "App deployed successfully with tag: ${{ env.IMAGE_TAG }}"

    - name: Cleanup - Restore User IP to AKS API Server
      if: always()
      run: |
        RUNNER_IP="${{ env.RUNNER_IP }}"
        USER_IP="177.245.192.41/32"
        if [ -n "$RUNNER_IP" ]; then
          echo "Removing runner IP ($RUNNER_IP/32), restoring user IP: $USER_IP"
          az aks update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --api-server-authorized-ip-ranges "$USER_IP"
        else
          echo "RUNNER_IP not set, restoring user IP only"
          az aks update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --api-server-authorized-ip-ranges "$USER_IP"
        fi

    - name: Cleanup - Remove GitHub Actions Runner IP from ACR
      if: always()
      run: |
        RUNNER_IP="${{ env.RUNNER_IP }}"
        if [ -z "$RUNNER_IP" ] || [ -z "$ACR_NAME" ] || [ "$ACR_NAME" = "PLACEHOLDER_ACR" ]; then
          echo "Runner IP or ACR name unavailable; skipping ACR firewall cleanup"
          exit 0
        fi
        echo "Removing temporary ACR firewall rule for $RUNNER_IP"
        az acr network-rule remove \
          --name "$ACR_NAME" \
          --resource-group "$RESOURCE_GROUP" \
          --ip-address "$RUNNER_IP" \
          --subscription "$AZURE_SUBSCRIPTION_ID" || true
      env:
        AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

