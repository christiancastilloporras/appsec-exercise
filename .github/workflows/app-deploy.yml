name: App Build and Deploy

on:
  # Manual trigger only
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag (default: git commit SHA)"
        required: false
      deploy_reason:
        description: "Reason for deployment"
        required: false
        default: "Manual deployment"

env:
  RESOURCE_GROUP: wiz-exercise-rg
  AKS_CLUSTER_NAME: wiz-aks-cluster
  ACR_NAME: PLACEHOLDER_ACR
  TFSTATE_CONTAINER: tfstate
  TF_VERSION: 1.7.5

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set Image Tag
      run: |
        if [ -z "${{ github.event.inputs.image_tag }}" ]; then
          echo "IMAGE_TAG=${GITHUB_SHA::8}" >> $GITHUB_ENV
        else
          echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_ENV
        fi

    - name: Install Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Azure Login
      uses: azure/login@v3
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Authorize GitHub Actions Runner IP for AKS API
      run: |
        RUNNER_IP=$(curl -s https://api.ipify.org)
        echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
        echo "Authorizing runner IP: $RUNNER_IP/32 for AKS API server access"
        az aks update \
          --resource-group "$RESOURCE_GROUP" \
          --name "$AKS_CLUSTER_NAME" \
          --api-server-authorized-ip-ranges "$RUNNER_IP/32"

    - name: Download Terraform State (if exists)
      continue-on-error: true
      run: |
        echo "Attempting to download Terraform state from Azure Blob Storage..."
        # Find storage account name from resource group
        TFSTATE_STORAGE_ACCOUNT=$(az storage account list \
          --resource-group "$RESOURCE_GROUP" \
          --query "[?contains(name, 'wizbackup')].name | [0]" -o tsv 2>/dev/null)
        if [ -n "$TFSTATE_STORAGE_ACCOUNT" ]; then
          echo "Found storage account: $TFSTATE_STORAGE_ACCOUNT"
          python3 scripts/download_tfstate.py "$TFSTATE_STORAGE_ACCOUNT" "$TFSTATE_CONTAINER" "$RESOURCE_GROUP"
        else
          echo "No storage account found in resource group $RESOURCE_GROUP"
        fi
        if [ -f terraform/terraform.tfstate ]; then
          echo "State file found: $(wc -c < terraform/terraform.tfstate) bytes"
        else
          echo "No state file downloaded - using local state"
        fi

    - name: Terraform Init
      run: |
        cd terraform
        terraform init -input=false

    - name: Get Terraform Outputs
      run: |
        cd terraform
        echo "MONGO_IP=$(terraform output -raw mongo_vm_private_ip)" >> $GITHUB_ENV
        echo "ACR_NAME=$(terraform output -raw acr_login_server | cut -d'.' -f1)" >> $GITHUB_ENV
        echo "ACR_USERNAME=$(terraform output -raw acr_username)" >> $GITHUB_ENV
        echo "ACR_PASSWORD=$(terraform output -raw acr_password)" >> $GITHUB_ENV
        # Write kubeconfig directly to file
        mkdir -p $HOME/.kube
        terraform output -raw aks_kube_config > $HOME/.kube/config
        echo "Kubeconfig written to $HOME/.kube/config"

    - name: Install kubectl
      uses: azure/setup-kubectl@v5

    - name: Download AKS Kubeconfig (if available)
      if: always()
      continue-on-error: true
      uses: actions/download-artifact@v5
      with:
        name: aks-kubeconfig
        path: $HOME/.kube
        merge-multiple: true

    - name: Set up Kubeconfig
      run: |
        if [ -f $HOME/.kube/kubeconfig ]; then
          mv $HOME/.kube/kubeconfig $HOME/.kube/config
        elif [ ! -f $HOME/.kube/config ]; then
          echo "No kubeconfig available from artifact"
        fi
        chmod 600 $HOME/.kube/config 2>/dev/null || true
        kubectl version --client
        kubectl get nodes 2>&1 || echo "kubectl cluster access unavailable (expected if no kubeconfig)"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to ACR
      run: |
        docker login ${{ env.ACR_NAME }}.azurecr.io \
          -u ${{ env.ACR_USERNAME }} \
          -p ${{ env.ACR_PASSWORD }}

    - name: Build and Push Docker Image
      run: |
        IMAGE_TAG="${{ env.IMAGE_TAG }}"
        ACR_FULL="${{ env.ACR_NAME }}.azurecr.io"
        FULL_IMAGE="$ACR_FULL/wiz-exercise:$IMAGE_TAG"
        docker build -t "$FULL_IMAGE" .
        docker push "$FULL_IMAGE"
        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
        echo "IMAGE_FULL=$FULL_IMAGE" >> $GITHUB_ENV

    - name: Run Trivy Vulnerability Scanner (non-blocking)
      continue-on-error: true
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ env.ACR_NAME }}.azurecr.io/wiz-exercise:${{ env.IMAGE_TAG }}'
        format: 'table'
        output: '/tmp/trivy-results.txt'
        severity: 'CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN'
        ignore-unfixed: true
        exit-code: '0'
        ignore-policy: ''
        vuln-type: 'os,library'

    - name: Generate SARIF Report
      if: always()
      continue-on-error: true
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ env.ACR_NAME }}.azurecr.io/wiz-exercise:${{ env.IMAGE_TAG }}'
        format: 'sarif'
        output: '/tmp/trivy-results.sarif'
        exit-code: '0'

    - name: Upload Trivy Scan Results
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: trivy-scan-results
        path: |
          /tmp/trivy-results.txt
          /tmp/trivy-results.sarif
        retention-days: 30

    - name: Deploy ACR Secret to Kubernetes
      run: |
        DOCKER_CONFIG=$(echo "{\"auths\":{\"${{ env.ACR_NAME }}.azurecr.io\":{\"username\":\"${{ env.ACR_USERNAME }}\",\"password\":\"${{ env.ACR_PASSWORD }}\",\"email\":\"\",\"server\":\"${{ env.ACR_NAME }}.azurecr.io\"}}}" | base64 -w 0)
        cat > /tmp/registry-secret.yaml << EOF
        apiVersion: v1
        kind: Secret
        metadata:
          name: acr-secret
        data:
          .dockerconfigjson: $DOCKER_CONFIG
        type: kubernetes.io/dockerconfigjson
        EOF
        kubectl apply -f /tmp/registry-secret.yaml

    - name: Update ConfigMap with Mongo IP
      run: |
        kubectl create configmap wiz-app-config \
          --from-literal=MONGO_IP="${{ env.MONGO_IP }}" \
          --from-literal=MONGO_URI="mongodb://${{ env.MONGO_IP }}:27017/admin-app" \
          --from-literal=SECRET_KEY="wiz-secret-key" \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Deploy K8s Manifests
      run: |
        sed "s|PLACEHOLDER_ACR|${{ env.ACR_NAME }}|g; s|PLACEHOLDER_TAG|${{ env.IMAGE_TAG }}|g; s|MONGO_IP_PLACEHOLDER|${{ env.MONGO_IP }}|g" k8s/deployment.yaml | kubectl apply -f -
        sed "s|MONGO_IP_PLACEHOLDER|${{ env.MONGO_IP }}|g" k8s/configmap.yaml | kubectl apply -f -
        sed "s|MONGO_IP_PLACEHOLDER|${{ env.MONGO_IP }}|g" k8s/seed-script.yaml | kubectl apply -f -
        kubectl apply -f k8s/service.yaml
        kubectl apply -f k8s/ingress.yaml
        kubectl apply -f k8s/service-account.yaml
        kubectl apply -f k8s/cluster-role-binding.yaml
        kubectl apply -f k8s/secrets.yaml

    - name: Verify Deployment
      run: |
        kubectl rollout status deployment/wiz-exercise-app --timeout=120s
        kubectl get pods -o wide
        kubectl get services
        kubectl get ingress
        echo "App deployed successfully with tag: ${{ env.IMAGE_TAG }}"

    - name: Cleanup - Remove Runner IP from AKS API Server
      if: always()
      run: |
        RUNNER_IP="${{ env.RUNNER_IP }}"
        if [ -n "$RUNNER_IP" ]; then
          echo "Removing runner IP ($RUNNER_IP/32) from AKS API server authorized ranges"
          az aks update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --api-server-authorized-ip-ranges ""
        else
          echo "RUNNER_IP not set, skipping cleanup"
        fi

    - name: Upload TF State to Azure Blob Storage
      if: always()
      run: |
        if [ ! -f terraform/terraform.tfstate ]; then
          echo "No state file to upload"
          exit 0
        fi

        echo "Found state file, uploading to Azure Blob Storage..."
        STATE_FILE="terraform/terraform.tfstate"

        # Upload using service principal auth via Azure CLI login
        TFSTATE_STORAGE_ACCOUNT=$(cd terraform && terraform output -raw storage_account_name 2>/dev/null)

        if [ -z "$TFSTATE_STORAGE_ACCOUNT" ]; then
          echo "ERROR: Could not get storage account name from terraform output"
          exit 1
        fi

        echo "Uploading to storage account: $TFSTATE_STORAGE_ACCOUNT"
        # Fetch storage account key (works with subscription-level Contributor role)
        TFSTATE_STORAGE_KEY=$(az storage account keys list \
          --account-name "$TFSTATE_STORAGE_ACCOUNT" \
          --resource-group "$RESOURCE_GROUP" \
          --query "[0].value" -o tsv 2>/dev/null)
        if [ -z "$TFSTATE_STORAGE_KEY" ]; then
          echo "ERROR: Could not get storage account key"
          exit 1
        fi
        az storage blob upload \
          --account-name "$TFSTATE_STORAGE_ACCOUNT" \
          --account-key "$TFSTATE_STORAGE_KEY" \
          --container-name "${TFSTATE_CONTAINER}" \
          --name "terraform.tfstate" \
          --file "$STATE_FILE" \
          --auth-mode key \
          --overwrite

        echo "TF state uploaded to Azure Blob Storage successfully"
