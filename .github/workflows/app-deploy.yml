name: App Build and Deploy

on:
  # Manual trigger only
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag (default: git commit SHA)'
        required: false
      deploy_reason:
        description: 'Reason for deployment'
        required: false
        default: 'Manual deployment'

env:
  RESOURCE_GROUP: wiz-exercise-rg
  AKS_CLUSTER_NAME: wiz-aks-cluster
  ACR_NAME: PLACEHOLDER_ACR
  TFSTATE_CONTAINER: tfstate
  TF_VERSION: 1.7.5

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set Image Tag
      run: |
        if [ -z "${{ github.event.inputs.image_tag }}" ]; then
          echo "IMAGE_TAG=${GITHUB_SHA::8}" >> $GITHUB_ENV
        else
          echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_ENV
        fi

    - name: Install Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Azure Login
      uses: azure/login@v3
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Authorize GitHub Actions Runner IP for AKS API
      run: |
        RUNNER_IP=$(curl -s https://api.ipify.org)
        echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV

        # Get current authorized IP ranges to preserve them
        CURRENT_IPS=$(az aks show \
          --resource-group "$RESOURCE_GROUP" \
          --name "$AKS_CLUSTER_NAME" \
          --query "apiServerAccessProfiles[0].authorizedIPRanges" -o tsv 2>/dev/null || echo "")

        USER_IP="177.245.192.41/32"
        echo "Current authorized IPs: $CURRENT_IPS"
        echo "User IP: $USER_IP"
        echo "Runner IP: $RUNNER_IP/32"

        # Combine: user IP + runner IP (preserve user access)
        COMBINED_IPS="$USER_IP,$RUNNER_IP/32"
        echo "Setting authorized IPs to: $COMBINED_IPS"

        az aks update \
          --resource-group "$RESOURCE_GROUP" \
          --name "$AKS_CLUSTER_NAME" \
          --api-server-authorized-ip-ranges "$COMBINED_IPS"

    - name: Download Terraform State (if exists)
      continue-on-error: true
      run: |
        echo "Attempting to download Terraform state from Azure Blob Storage..."
        TFSTATE_STORAGE_ACCOUNT=$(az storage account list \
          --resource-group "$RESOURCE_GROUP" \
          --query "[?contains(name, 'wizbackup')].name | [0]" -o tsv 2>/dev/null)
        if [ -n "$TFSTATE_STORAGE_ACCOUNT" ]; then
          echo "Found storage account: $TFSTATE_STORAGE_ACCOUNT"
          python3 scripts/download_tfstate.py "$TFSTATE_STORAGE_ACCOUNT" "$TFSTATE_CONTAINER" "$RESOURCE_GROUP"
        else
          echo "No storage account found in resource group $RESOURCE_GROUP"
        fi
        if [ -f terraform/terraform.tfstate ]; then
          echo "State file found: $(wc -c < terraform/terraform.tfstate) bytes"
        else
          echo "No state file downloaded - using local state"
        fi

    - name: Terraform Init
      run: |
        cd terraform
        terraform init -input=false

    - name: Get Terraform Outputs
      run: |
        cd terraform
        echo "MONGO_IP=$(terraform output -raw mongo_vm_private_ip)" >> $GITHUB_ENV
        echo "ACR_NAME=$(terraform output -raw acr_login_server | cut -d'.' -f1)" >> $GITHUB_ENV
        echo "ACR_USERNAME=$(terraform output -raw acr_username)" >> $GITHUB_ENV
        echo "ACR_PASSWORD=$(terraform output -raw acr_password)" >> $GITHUB_ENV
        mkdir -p $HOME/.kube
        terraform output -raw aks_kube_config > $HOME/.kube/config
        echo "Kubeconfig written to $HOME/.kube/config"

    - name: Install kubectl
      uses: azure/setup-kubectl@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to ACR
      run: |
        docker login ${{ env.ACR_NAME }}.azurecr.io \
          -u ${{ env.ACR_USERNAME }} \
          -p ${{ env.ACR_PASSWORD }}

    - name: Build and Push Docker Image
      run: |
        IMAGE_TAG="${{ env.IMAGE_TAG }}"
        ACR_FULL="${{ env.ACR_NAME }}.azurecr.io"
        FULL_IMAGE="$ACR_FULL/wiz-exercise:$IMAGE_TAG"
        docker build -t "$FULL_IMAGE" .
        docker push "$FULL_IMAGE"
        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
        echo "IMAGE_FULL=$FULL_IMAGE" >> $GITHUB_ENV

    - name: Run Trivy Vulnerability Scanner (non-blocking)
      continue-on-error: true
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ env.ACR_NAME }}.azurecr.io/wiz-exercise:${{ env.IMAGE_TAG }}'
        format: 'table'
        output: '/tmp/trivy-results.txt'
        severity: 'CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN'
        ignore-unfixed: true
        exit-code: '0'
        ignore-policy: ''
        vuln-type: 'os,library'

    - name: Generate SARIF Report
      if: always()
      continue-on-error: true
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ env.ACR_NAME }}.azurecr.io/wiz-exercise:${{ env.IMAGE_TAG }}'
        format: 'sarif'
        output: '/tmp/trivy-results.sarif'
        exit-code: '0'

    - name: Upload Trivy Scan Results
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: trivy-scan-results
        path: |
          /tmp/trivy-results.txt
          /tmp/trivy-results.sarif
        retention-days: 30

    - name: Deploy ACR Secret to Kubernetes
      run: |
        DOCKER_CONFIG=$(echo "{\"auths\":{\"${{ env.ACR_NAME }}.azurecr.io\":{\"username\":\"${{ env.ACR_USERNAME }}\",\"password\":\"${{ env.ACR_PASSWORD }}\",\"email\":\"\",\"server\":\"${{ env.ACR_NAME }}.azurecr.io\"}}}" | base64 -w 0)
        cat > /tmp/registry-secret.yaml << 'EOF'
        apiVersion: v1
        kind: Secret
        metadata:
          name: acr-secret
        data:
          .dockerconfigjson: PLACEHOLDER_DOCKER_CONFIG
        type: kubernetes.io/dockerconfigjson
        EOF
        sed "s|PLACEHOLDER_DOCKER_CONFIG|$DOCKER_CONFIG|g" /tmp/registry-secret.yaml | kubectl apply -f -

    - name: Update ConfigMap with Mongo IP
      run: |
        kubectl create configmap wiz-app-config \
          --from-literal=MONGO_IP="${{ env.MONGO_IP }}" \
          --from-literal=MONGO_URI="mongodb://${{ env.MONGO_IP }}:27017/admin-app" \
          --from-literal=SECRET_KEY="wiz-secret-key" \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Deploy K8s Manifests
      run: |
        sed "s|PLACEHOLDER_ACR|${{ env.ACR_NAME }}|g; s|PLACEHOLDER_TAG|${{ env.IMAGE_TAG }}|g; s|MONGO_IP_PLACEHOLDER|${{ env.MONGO_IP }}|g" k8s/deployment.yaml | kubectl apply -f -
        sed "s|MONGO_IP_PLACEHOLDER|${{ env.MONGO_IP }}|g" k8s/configmap.yaml | kubectl apply -f -
        sed "s|MONGO_IP_PLACEHOLDER|${{ env.MONGO_IP }}|g" k8s/seed-script.yaml | kubectl apply -f -
        kubectl apply -f k8s/service.yaml
        kubectl apply -f k8s/ingress.yaml
        kubectl apply -f k8s/service-account.yaml
        kubectl apply -f k8s/cluster-role-binding.yaml
        kubectl apply -f k8s/secrets.yaml

    - name: Wait for LoadBalancer IP and Create Cloudflare DNS Record
      if: always()
      env:
        CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      run: |
        # Wait for the LoadBalancer to get an external IP
        echo "Waiting for LoadBalancer external IP..."
        TIMEOUT=300
        INTERVAL=15
        ELAPSED=0

        while [ $ELAPSED -lt $TIMEOUT ]; do
          LB_IP=$(kubectl get svc wiz-exercise-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
          if [ -n "$LB_IP" ] && [ "$LB_IP" != "<none>" ]; then
            echo "LoadBalancer IP found: $LB_IP"
            echo "LB_IP=$LB_IP" >> $GITHUB_ENV
            break
          fi
          echo "Waiting for LoadBalancer IP... ($ELAPSED/${TIMEOUT}s)"
          sleep $INTERVAL
          ELAPSED=$((ELAPSED + INTERVAL))
        done

        if [ -z "$LB_IP" ] || [ "$LB_IP" = "<none>" ]; then
          echo "ERROR: LoadBalancer IP not assigned within timeout"
          kubectl get svc wiz-exercise-service -o wide
          exit 1
        fi

        # Check if DNS record already exists (idempotent)
        EXISTING=$(curl -s "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records?type=A&name=app" \
          -H "Authorization: Bearer $CF_API_TOKEN" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['result'][0]['id'] if data.get('result') else '')" 2>/dev/null || echo "")

        if [ -n "$EXISTING" ]; then
          echo "Updating existing DNS record $EXISTING"
          curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records/$EXISTING" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"type\":\"A\",\"name\":\"app\",\"content\":\"${LB_IP}\",\"ttl\":1,\"proxied\":true}"
        else
          echo "Creating new DNS record"
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"type\":\"A\",\"name\":\"app\",\"content\":\"${LB_IP}\",\"ttl\":1,\"proxied\":true}"
        fi

        echo "DNS record 'app.cloudguardian.xyz' created/updated pointing to $LB_IP"

        # Request Cloudflare Origin CA Certificate for the domain
        CERT_HOSTNAME="app.cloudguardian.xyz"
        echo "Requesting Origin CA certificate for $CERT_HOSTNAME..."
        # Use lowercase endpoint: /origin_ca/certificates (NOT /Origin_CA/certificates)
        CA_RESPONSE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/origin_ca/certificates" \
          -H "Authorization: Bearer $CF_API_TOKEN" \
          -H "Content-Type: application/json" \
          --data "{\"hostnames\":[\"$CERT_HOSTNAME\"],\"certificate_type\":\"origin-rsa\"}")

        if echo "$CA_RESPONSE" | grep -q '"success":true'; then
          echo "Origin CA certificate issued successfully"
          # Extract certificate and private key using dedicated script
          echo "$CA_RESPONSE" | python3 scripts/extract-origin-cert.py
          # Validate certificate
          openssl x509 -in /tmp/origin-cert.pem -text -noout | head -5
          echo "Certificate validation passed"
        else
          echo "Failed to issue Origin CA certificate:"
          echo "$CA_RESPONSE" | python3 -m json.tool 2>/dev/null || echo "$CA_RESPONSE"
          exit 1
        fi

        # Create Kubernetes TLS Secret from the Origin CA certificate
        kubectl create secret tls tls-origin-cert \
          --cert=/tmp/origin-cert.pem \
          --key=/tmp/origin-key.pem \
          --dry-run=client -o yaml | kubectl apply -f -
        echo "TLS secret 'tls-origin-cert' created"

        # Update Ingress to use TLS with the Origin CA certificate
        kubectl patch ingress wiz-exercise-ingress --type='merge' -p='{
          "spec": {
            "tls": [
              {
                "hosts": ["app.cloudguardian.xyz"],
                "secretName": "tls-origin-cert"
              }
            ]
          }
        }'
        echo "Ingress TLS configuration applied"

    - name: Verify Deployment
      run: |
        kubectl rollout status deployment/wiz-exercise-app --timeout=120s
        kubectl get pods -o wide
        kubectl get services
        kubectl get ingress
        echo "App deployed successfully with tag: ${{ env.IMAGE_TAG }}"

    - name: Cleanup - Restore User IP to AKS API Server
      if: always()
      run: |
        RUNNER_IP="${{ env.RUNNER_IP }}"
        USER_IP="177.245.192.41/32"
        if [ -n "$RUNNER_IP" ]; then
          echo "Removing runner IP ($RUNNER_IP/32), restoring user IP: $USER_IP"
          az aks update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --api-server-authorized-ip-ranges "$USER_IP"
        else
          echo "RUNNER_IP not set, restoring user IP only"
          az aks update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --api-server-authorized-ip-ranges "$USER_IP"
        fi

    - name: Upload TF State to Azure Blob Storage
      if: always()
      run: |
        if [ ! -f terraform/terraform.tfstate ]; then
          echo "No state file to upload"
          exit 0
        fi

        echo "Found state file, uploading to Azure Blob Storage..."
        STATE_FILE="terraform/terraform.tfstate"

        TFSTATE_STORAGE_ACCOUNT=$(cd terraform && terraform output -raw storage_account_name 2>/dev/null)

        if [ -z "$TFSTATE_STORAGE_ACCOUNT" ]; then
          echo "ERROR: Could not get storage account name from terraform output"
          exit 1
        fi

        echo "Uploading to storage account: $TFSTATE_STORAGE_ACCOUNT"
        TFSTATE_STORAGE_KEY=$(az storage account keys list \
          --account-name "$TFSTATE_STORAGE_ACCOUNT" \
          --resource-group "$RESOURCE_GROUP" \
          --query "[0].value" -o tsv 2>/dev/null)
        if [ -z "$TFSTATE_STORAGE_KEY" ]; then
          echo "ERROR: Could not get storage account key"
          exit 1
        fi
        az storage blob upload \
          --account-name "$TFSTATE_STORAGE_ACCOUNT" \
          --account-key "$TFSTATE_STORAGE_KEY" \
          --container-name "${TFSTATE_CONTAINER}" \
          --name "terraform.tfstate" \
          --file "$STATE_FILE" \
          --auth-mode key \
          --overwrite

        echo "TF state uploaded to Azure Blob Storage successfully"
