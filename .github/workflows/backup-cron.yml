name: Daily MongoDB Backup

on:
  # Daily at 2:00 AM UTC
  schedule:
    - cron: "0 2 * * *"
  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      force_backup:
        description: 'Force backup now'
        required: false
        default: 'false'

env:
  RESOURCE_GROUP: wiz-exercise-rg
  TFSTATE_CONTAINER: tfstate

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install Terraform
      uses: hashicorp/setup-terraform@v4

    - name: Azure Login
      uses: azure/login@v3
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Download Terraform State (if exists)
      continue-on-error: true
      run: |
        echo "Attempting to download Terraform state from Azure Blob Storage..."
        # Find storage account name from resource group
        TFSTATE_STORAGE_ACCOUNT=$(az storage account list \
          --resource-group "$RESOURCE_GROUP" \
          --query "[?contains(name, 'wizbackup')].name | [0]" -o tsv 2>/dev/null)
        if [ -n "$TFSTATE_STORAGE_ACCOUNT" ]; then
          echo "Found storage account: $TFSTATE_STORAGE_ACCOUNT"
          python3 scripts/download_tfstate.py \"$TFSTATE_STORAGE_ACCOUNT\" \"${TFSTATE_CONTAINER}\" \"$RESOURCE_GROUP\"
        else
          echo "No storage account found in resource group $RESOURCE_GROUP"
        fi
        if [ -f terraform/terraform.tfstate ]; then
          echo "State file found: $(wc -c < terraform/terraform.tfstate) bytes"
        else
          echo "No state file downloaded - using local state"
        fi

    - name: Terraform Init
      run: |
        cd terraform
        terraform init

    - name: Get Terraform Outputs
      run: |
        cd terraform
        echo "MONGO_IP=$(terraform output -raw mongo_vm_public_ip)" >> $GITHUB_ENV
        echo "STORAGE_ACCOUNT=$(terraform output -raw storage_account_name)" >> $GITHUB_ENV
        echo "STORAGE_KEY=$(terraform output -raw storage_blob_access_key)" >> $GITHUB_ENV
        echo "CONTAINER_NAME=$(terraform output -raw storage_container_name)" >> $GITHUB_ENV

    - name: Install mongodump and Azure CLI
      run: |
        sudo apt-get update
        sudo apt-get install -y mongodb-clients azure-cli

    - name: Run MongoDB Backup
      run: |
        MONGO_IP=${{ env.MONGO_IP }} \
        STORAGE_ACCOUNT=${{ env.STORAGE_ACCOUNT }} \
        STORAGE_KEY=${{ env.STORAGE_KEY }} \
        CONTAINER_NAME=${{ env.CONTAINER_NAME }} \
        bash scripts/backup-mongo.sh

    - name: Verify Backup Upload
      run: |
        echo "Checking latest backups in blob container..."
        az storage blob list \
          --account-name ${{ env.STORAGE_ACCOUNT }} \
          --account-key ${{ env.STORAGE_KEY }} \
          --container-name ${{ env.CONTAINER_NAME }} \
          --query "[].name" -o table