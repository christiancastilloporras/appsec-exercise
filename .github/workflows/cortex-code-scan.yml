name: Cortex Code Security Scan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  cortex-code-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Run Cortex Code Security Scan
      id: scan
      uses: PaloAltoNetworks/cortex-cloud-scan@v1
      with:
        scan-type: code
        api-base-url: ${{ secrets.CORTEX_API_BASE_URL }}
        api-key: ${{ secrets.CORTEX_API_KEY }}
        api-key-id: ${{ secrets.CORTEX_API_KEY_ID }}
        directory: .
        repo-id: ${{ github.repository }}
        branch: ${{ github.ref_name }}
        upload-mode: upload
        framework: terraform,kubernetes,secrets,sca
        output-format: cli
        output-file-path: cortex-results.txt
        soft-fail: true

    - name: Upload Scan Results as Artifact
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: cortex-scan-results
        path: cortex-results.txt
        retention-days: 30
