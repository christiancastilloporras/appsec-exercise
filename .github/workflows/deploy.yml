name: Infrastructure Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_reason:
        description: 'Reason for deployment'
        required: false
        default: 'Manual deployment'

env:
  RESOURCE_GROUP: wiz-exercise-rg

jobs:
  terraform-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install Terraform
      uses: hashicorp/setup-terraform@v4

    - name: Azure Login
      uses: azure/login@v3
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Grant RBAC Permission for Role Assignment
      run: |
        # The service principal needs User Access Administrator at subscription level
        # to create role assignments (e.g., ACR Pull role for AKS)
        SUB_ID=$(az account show --query "id" -o tsv)
        az role assignment create --assignee $(az account show --query "user.name" -o tsv) --role "User Access Administrator" --scope /subscriptions/$SUB_ID || true
      continue-on-error: true

    - name: Download Terraform State (if exists)
      continue-on-error: true
      run: |
        curl -sLH "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
          -o /tmp/release.json || true
        python3 scripts/download_tfstate.py /tmp/release.json "${{ secrets.GITHUB_TOKEN }}"

    - name: Terraform Init
      run: |
        cd terraform
        terraform init

    - name: Terraform Apply
      run: |
        cd terraform
        terraform apply -auto-approve

    - name: Get Terraform Outputs
      run: |
        cd terraform
        terraform output -json

    - name: Verify Infrastructure
      run: |
        az vm list -g ${{ env.RESOURCE_GROUP }} -o table
        az aks list -g ${{ env.RESOURCE_GROUP }} -o table
        az acr list -g ${{ env.RESOURCE_GROUP }} -o table

    - name: Upload TF State to Release
      if: success()
      run: |
        RELEASE_TAG="tf-state"
        RELEASE_DATA='{tag_name: "tf-state", name: "Terraform State", body: "TF State file for wiz-exercise", target_commitish: "main", draft: false, prerelease: false}'
        
        # Check if state file exists before uploading
        if [ ! -f terraform/terraform.tfstate ]; then
          echo "No state file to upload"
          echo "Terraform state upload skipped" 
          exit 0
        fi
        
        echo "Found state file, uploading..."
        
        EXISTING_RELEASE=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/${{ github.repository }}/releases/tags/$RELEASE_TAG" || true)
        if [ -n "$EXISTING_RELEASE" ] && [ "$EXISTING_RELEASE" != "null" ]; then
          RELEASE_ID=$(echo "$EXISTING_RELEASE" | jq -r '.id')
          curl -X PATCH -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID" \
            -d "$RELEASE_DATA"
        else
          RELEASE_ID=$(curl -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "$RELEASE_DATA" | jq -r '.id')
        fi
        ASSET_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets" | jq -r '.[] | select(.name=="terraform.tfstate") | .id' || true)
        if [ -n "$ASSET_ID" ] && [ "$ASSET_ID" != "null" ]; then
          curl -X DELETE -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/$ASSET_ID"
        fi
        curl -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/octet-stream" \
          "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=terraform.tfstate" \
          -H "Content-Type: application/octet-stream" \
          --data-binary @terraform/terraform.tfstate || true