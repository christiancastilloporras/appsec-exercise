name: Deploy Falco Security

on:
  workflow_dispatch:
    inputs:
      deploy_reason:
        description: 'Reason for deploying Falco'
        required: false
        default: 'Manual deployment'
      namespace:
        description: 'Kubernetes namespace for Falco'
        required: false
        default: 'falco'
      falco_version:
        description: 'Falco chart version'
        required: false
        default: '4.0.0'

# Permissions for artifact uploads
permissions:
  contents: read

env:
  RESOURCE_GROUP: wiz-exercise-rg
  AKS_CLUSTER_NAME: wiz-aks-cluster
  TFSTATE_CONTAINER: tfstate

jobs:
  deploy-falco:
    # Guard: only run on manual triggers. Without this, GitHub registers
    # push events as failed runs (0s, no jobs) whenever the workflow file
    # is committed. This conditional skips the job on any non-manual event.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Azure Login
      uses: azure/login@v3
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Authorize GitHub Actions Runner IP for AKS API
      run: |
        RUNNER_IP=$(curl -s https://api.ipify.org)
        echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV

        # Get current authorized IP ranges to preserve them
        CURRENT_IPS=$(az aks show \
          --resource-group "$RESOURCE_GROUP" \
          --name "$AKS_CLUSTER_NAME" \
          --query "apiServerAccessProfiles[0].authorizedIPRanges" -o tsv 2>/dev/null || echo "")

        USER_IP="177.245.192.41/32"
        echo "Current authorized IPs: $CURRENT_IPS"
        echo "User IP: $USER_IP"
        echo "Runner IP: $RUNNER_IP/32"

        # Combine: user IP + runner IP (preserve user access)
        COMBINED_IPS="$USER_IP,$RUNNER_IP/32"
        echo "Setting authorized IPs to: $COMBINED_IPS"

        az aks update \
          --resource-group "$RESOURCE_GROUP" \
          --name "$AKS_CLUSTER_NAME" \
          --api-server-authorized-ip-ranges "$COMBINED_IPS"

    - name: Download Terraform State (if exists)
      continue-on-error: true
      run: |
        echo "Attempting to download Terraform state from Azure Blob Storage..."
        TFSTATE_STORAGE_ACCOUNT=$(az storage account list \
          --resource-group "$RESOURCE_GROUP" \
          --query "[?contains(name, 'wizbackup')].name | [0]" -o tsv 2>/dev/null)
        if [ -n "$TFSTATE_STORAGE_ACCOUNT" ]; then
          echo "Found storage account: $TFSTATE_STORAGE_ACCOUNT"
          python3 scripts/download_tfstate.py "$TFSTATE_STORAGE_ACCOUNT" "$TFSTATE_CONTAINER" "$RESOURCE_GROUP"
        else
          echo "No storage account found in resource group $RESOURCE_GROUP"
        fi
        if [ -f terraform/terraform.tfstate ]; then
          echo "State file found: $(wc -c < terraform/terraform.tfstate) bytes"
        else
          echo "No state file downloaded - using local state"
        fi

    - name: Terraform Init
      run: |
        cd terraform
        terraform init -input=false

    - name: Get Terraform Outputs
      run: |
        cd terraform
        echo "ACR_NAME=$(terraform output -raw acr_login_server | cut -d'.' -f1)" >> $GITHUB_ENV
        echo "ACR_USERNAME=$(terraform output -raw acr_username)" >> $GITHUB_ENV
        echo "ACR_PASSWORD=$(terraform output -raw acr_password)" >> $GITHUB_ENV
        mkdir -p $HOME/.kube
        terraform output -raw aks_kube_config > $HOME/.kube/config
        echo "Kubeconfig written to $HOME/.kube/config"

    - name: Install kubectl
      uses: azure/setup-kubectl@v5

    - name: Install Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.18.0

    - name: Login to ACR for Falco driver images
      if: env.ACR_USERNAME != ''
      run: |
        helm registry login ${{ env.ACR_NAME }}.azurecr.io \
          --username ${{ env.ACR_USERNAME }} \
          --password ${{ env.ACR_PASSWORD }} 2>/dev/null || echo "ACR login skipped or failed"

    - name: Create Falco Namespace
      run: |
        kubectl create namespace ${{ inputs.namespace }} 2>/dev/null || echo "Namespace already exists"

    - name: Add Falco Helm Repository
      run: |
        helm repo add falcosecurity https://falcosecurity.github.io/helm-deprecated/ || \
        helm repo add falcosecurity https://falcosecurity.github.io/charts || \
        helm repo update

    - name: Deploy Falco with WebUI (ClusterIP services only)
      run: |
        NAMESPACE="${{ inputs.namespace }}"
        FALCO_VERSION="${{ inputs.falco_version }}"

        echo "Installing Falco with WebUI in namespace: $NAMESPACE"
        echo "Using Falco Helm chart version: $FALCO_VERSION"

        helm upgrade --install falco falcosecurity/falco \
          --namespace "$NAMESPACE" \
          --version "$FALCO_VERSION" \
          --set falco.json_output=true \
          --set falco.http_output.enabled=true \
          --set falco.http_output url=http://falco-falcosidekick-svc:8080/ \
          --set falco.rules_file.rules_falco_rules='[{"rule":"Write to non-writeable filesystem (open for write)","desc":"Attempt to write to non-writeable file","cond":"(evt.type in (open,openat) and (fd.snum > 0) and (evt.dir = <)) or (evt.type = openexecat and (fd.snum > 0))","output":"File non-writeable (%user>%container_id) open for write","priority":"WARNING","enabled":"true","tags":["filesystem","write"]}]' \
          --set falcoctl.enabled=true \
          --set falcoctl.container.name=falcoctl \
          --set falcoctl.container.image.repository=falcosecurity/falcoctl \
          --set falcoctl.container.image.tag=0.6.7 \
          --set falcoctl.container.pullPolicy=IfNotPresent \
          --set falcoctl.artifact.install.artifact.enabled=true \
          --set falcoctl.artifact.install.artifact.type=plain \
          --set falcoctl.artifact.install.artifact.plain.enabled=true \
          --set falcoctl.artifact.install.artifact.artifactRegistry=localhost:5000 \
          --set falcoctl.artifact.install.artifact.artifactRepository=falcosecurity \
          --set falcoctl.artifact.install.artifact.artifactPrefix=falcoctl \
          --set falcoctl.artifact.install.artifact.name=plugin-k8s-open-1.3.2 \
          --set falcoctl.artifact.install.artifact.version=1.3.2 \
          --set falcoctl.artifact.install.artifact.enabled=true \
          --timeout 10m \
          --wait

        echo "Falco deployed successfully"

        # Verify deployment
        kubectl get pods -n "$NAMESPACE" -l app=falco
        kubectl get services -n "$NAMESPACE"

    - name: Deploy Falco Sidekick (for WebUI)
      run: |
        NAMESPACE="${{ inputs.namespace }}"
        FALCO_VERSION="${{ inputs.falco_version }}"

        echo "Installing Falco Sidekick in namespace: $NAMESPACE"

        helm upgrade --install falco-sidekick falcosecurity/falco-sidekick \
          --namespace "$NAMESPACE" \
          --version 2.0.0 \
          --set config.enabled=true \
          --set config.webserver.enabled=true \
          --set config.webserver.port=2019 \
          --set config.slack.enabled=false \
          --set config.prometheus.enabled=true \
          --set service.type=ClusterIP \
          --set service.port=80 \
          --timeout 5m \
          --wait

        echo "Falco Sidekick deployed successfully"
        kubectl get pods -n "$NAMESPACE" -l app=falco-sidekick

    - name: Deploy Falco WebUI (ClusterIP only - no LB or Ingress)
      run: |
        NAMESPACE="${{ inputs.namespace }}"

        echo "Installing Falco WebUI in namespace: $NAMESPACE"

        helm upgrade --install falco-webui falcosecurity/falco-webui \
          --namespace "$NAMESPACE" \
          --version 0.8.0 \
          --set service.type=ClusterIP \
          --set service.port=2019 \
          --set ingress.enabled=false \
          --set ingress.hosts[0]="falco.local" \
          --set ingress.tls=false \
          --set nginx.enabled=false \
          --timeout 5m \
          --wait

        echo "Falco WebUI deployed successfully with ClusterIP service (no LoadBalancer)"
        kubectl get pods -n "$NAMESPACE" -l app=falco-webui
        kubectl get services -n "$NAMESPACE"

    - name: Verify Falco Deployment
      run: |
        NAMESPACE="${{ inputs.namespace }}"
        echo "=== Falco Pods ==="
        kubectl get pods -n "$NAMESPACE" -o wide || true
        echo "=== Falco Services ==="
        kubectl get services -n "$NAMESPACE" -o wide || true
        echo "=== Falco Helm Release ==="
        helm list -n "$NAMESPACE" || true
        echo "=== Falco Logs (last 20 lines) ==="
        kubectl logs -n "$NAMESPACE" -l app=falco --tail=20 || true

    - name: Display Port-Forward Instructions
      run: |
        NAMESPACE="${{ inputs.namespace }}"
        echo "========================================"
        echo "Falco WebUI deployed with ClusterIP only"
        echo "========================================"
        echo ""
        echo "To access the WebUI, run:"
        echo "  kubectl port-forward svc/falco-webui-webui \"${{ env.WEBUI_PORT:-2019 }}\":2019 -n $NAMESPACE"
        echo ""
        echo "Then open: http://localhost:${{ env.WEBUI_PORT:-2019 }}"
        echo ""
        echo "Falco service endpoints:"
        kubectl get svc -n "$NAMESPACE" -l app=falco-webui -o jsonpath='{.items[].spec.clusterIP}' || true

    - name: Cleanup - Restore User IP to AKS API Server
      if: always()
      run: |
        RUNNER_IP="${{ env.RUNNER_IP }}"
        USER_IP="177.245.192.41/32"
        if [ -n "$RUNNER_IP" ]; then
          echo "Removing runner IP ($RUNNER_IP/32), restoring user IP: $USER_IP"
          az aks update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --api-server-authorized-ip-ranges "$USER_IP"
        else
          echo "RUNNER_IP not set, restoring user IP only"
          az aks update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --api-server-authorized-ip-ranges "$USER_IP"
        fi
