name: MongoDB & AKS Temporary Access

on:
  workflow_dispatch:
    inputs:
      ip_address:
        description: "Public IP address to grant temporary access (e.g., 123.45.67.89)"
        required: true
        type: string
      action:
        description: "Action to perform"
        required: true
        type: choice
        default: "add"
        options:
          - add
          - remove

env:
  RESOURCE_GROUP: appsec-exercise-rg
  NSG_NAME: mongo-nsg
  NSG_RULE_NAME: Mongo-Allow-IP
  NSG_RULE_PRIORITY: 1051
  AKS_CLUSTER_NAME: appsec-aks-cluster

jobs:
  manage-access:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Build creds JSON from separated secrets
      id: build_creds
      env:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      run: |
        cat > "$GITHUB_OUTPUT" <<EOF
        creds_json={"clientId":"${AZURE_CLIENT_ID}","clientSecret":"${AZURE_CLIENT_SECRET}","tenantId":"${AZURE_TENANT_ID}","subscriptionId":"${AZURE_SUBSCRIPTION_ID}","activeDirectoryAppIdUrl":"https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/authorize","activeDirectoryGraphResourceId":"https://graph.windows.net/","activeDirectoryServiceEndpointResourceId":"https://management.azure.com/"}
        EOF

    - name: Azure Login
      uses: azure/login@v3
      with:
        creds: ${{ steps.build_creds.outputs.creds_json }}
    
    - name: Add Temporary Access (Mongo NSG + AKS API Server)
      if: ${{ inputs.action == 'add' }}
      run: |
        IP="${{ inputs.ip_address }}"
        # Validate it's a proper IP format
        if ! [[ "$IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+(/[0-9]+)?$ ]]; then
          echo "Invalid IP address format: $IP"
          exit 1
        fi
        
        echo "Adding NSG rule '$NSG_RULE_NAME' (priority $NSG_RULE_PRIORITY) for $IP -> 27017 on $NSG_NAME"
        
        az network nsg rule create \
          --resource-group "$RESOURCE_GROUP" \
          --nsg-name "$NSG_NAME" \
          --name "$NSG_RULE_NAME" \
          --priority "$NSG_RULE_PRIORITY" \
          --direction Inbound \
          --access Allow \
          --protocol Tcp \
          --source-address-prefixes "$IP" \
          --source-port-ranges '*' \
          --destination-address-prefixes '*' \
          --destination-port-ranges 27017 \
          --description "Temporary access for ${{ github.actor }} (${IP})"
        
        echo "--- Current NSG rules on $NSG_NAME ---"
        az network nsg rule list --resource-group "$RESOURCE_GROUP" --nsg-name "$NSG_NAME" --query "[].{Name:name, Priority:priority, Source:sourceAddressPrefix, Dest:destinationPortRange}" -o table

        echo "Adding IP to AKS API server authorized ranges"
        az aks update \
          --resource-group "$RESOURCE_GROUP" \
          --name "$AKS_CLUSTER_NAME" \
          --api-server-authorized-ip-ranges "$IP"
        
        echo "✅ IP $IP/32 added for MongoDB NSG + AKS API server access"

    - name: Remove Temporary Access (Mongo NSG + AKS API Server)
      if: ${{ inputs.action == 'remove' }}
      run: |
        echo "Removing NSG rule '$NSG_RULE_NAME' from $NSG_NAME"
        az network nsg rule delete \
          --resource-group "$RESOURCE_GROUP" \
          --nsg-name "$NSG_NAME" \
          --name "$NSG_RULE_NAME" || echo "Rule '$NSG_RULE_NAME' did not exist or was already removed."

        echo "--- Remaining NSG rules on $NSG_NAME ---"
        az network nsg rule list --resource-group "$RESOURCE_GROUP" --nsg-name "$NSG_NAME" --query "[].{Name:name, Priority:priority, Source:sourceAddressPrefix, Dest:destinationPortRange}" -o table

        echo "Removing IP from AKS API server authorized ranges"
        az aks update \
          --resource-group "$RESOURCE_GROUP" \
          --name "$AKS_CLUSTER_NAME" \
          --api-server-authorized-ip-ranges ""
        
        echo "✅ IP access removed from MongoDB NSG + AKS API server"
