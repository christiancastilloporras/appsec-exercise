name: Terraform Apply/Destroy

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform Action'
        required: true
        type: choice
        default: 'apply'
        options:
          - apply
          - destroy
      location:
        description: 'Azure Region'
        required: false
        default: 'West US'
      mongo_vm_size:
        description: 'Mongo VM Size (e.g. Standard_B1s, Standard_B2s, Standard_D2s_v3)'
        required: false
        default: 'Standard_B1s'
      aks_vm_size:
        description: 'AKS Node VM Size (e.g. Standard_B2s, Standard_D2s_v3, Standard_D4s_v3)'
        required: false
        default: 'Standard_B2s'

env:
  RESOURCE_GROUP: wiz-exercise-rg
  TF_VERSION: 1.7.5

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ env.TF_VERSION }}
        cli_config_credentials_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure Azure Credentials
      uses: azure/login@v3
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Grant RBAC Permission for Role Assignment
      run: |
        # The service principal needs User Access Administrator at subscription level
        # to create role assignments (e.g., ACR Pull role for AKS).
        # Contributor role does NOT include Microsoft.Authorization/roleAssignments/write
        SUB_ID=$(az account show --query "id" -o tsv)
        CLIENT_ID=$(az account show --query "user.name" -o tsv)
        SPN_OBJ_ID=$(az ad sp show --id "$CLIENT_ID" --query "objectId" -o tsv 2>/dev/null || echo "")
        echo "Granting User Access Administrator to SPN (objectId: $SPN_OBJ_ID) at subscription level"
        az role assignment create --assignee "$SPN_OBJ_ID" --role "User Access Administrator" --scope /subscriptions/$SUB_ID 2>/dev/null || \
        az role assignment create --assignee "$SPN_OBJ_ID" --role "Owner" --scope /subscriptions/$SUB_ID 2>/dev/null || \
        echo "RBAC grant attempted - may already have permission"
      continue-on-error: true

    - name: Download Terraform State (if exists)
      continue-on-error: true
      working-directory: .
      run: |
        curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
          -o /tmp/release.json || true
        python3 scripts/download_tfstate.py /tmp/release.json "${{ secrets.GITHUB_TOKEN }}"
        if [ -f terraform/terraform.tfstate ]; then
          echo "State file found: $(wc -c < terraform/terraform.tfstate) bytes"
        else
          echo "No state file downloaded - will use Azure CLI cleanup as fallback"
        fi

    - name: Terraform Init
      run: |
        cd terraform
        terraform init -input=false

    - name: Terraform Apply
      if: github.event.inputs.action == 'apply'
      run: |
        cd terraform
        terraform apply -auto-approve \
          -var="location=${{ github.event.inputs.location }}" \
          -var="mongo_vm_size=${{ github.event.inputs.mongo_vm_size }}" \
          -var="aks_vm_size=${{ github.event.inputs.aks_vm_size }}" || true
      continue-on-error: true

    - name: Copy State for Upload
      if: always() && github.event.inputs.action == 'apply'
      run: |
        cd terraform
        # terraform.tfstate contains the state from the apply attempt
        # Even if apply failed partway, the state file has resources that were created
        ls -la terraform.tfstate 2>/dev/null || echo "No state file"

    - name: Terraform Destroy
      if: github.event.inputs.action == 'destroy'
      run: |
        cd terraform
        # Check if state file exists
        if [ ! -f terraform.tfstate ]; then
          echo "No state file found. Resources may have been partially created."
          echo "Attempting Azure CLI cleanup..."
          # List all resource groups matching the naming pattern
          az group list --query "[?contains(name, 'wiz-exercise')].name" -o tsv | while read rg; do
          if [ -n "$rg" ]; then
            echo "Deleting resource group: $rg"
            az group delete --name "$rg" --yes --no-wait
          fi
        done
        echo "Azure CLI cleanup initiated. Waiting for deletion to complete..."
        for rg in $(az group list --query "[?contains(name, 'wiz-exercise')].name" -o tsv); do
          if [ -n "$rg" ]; then
            echo "Waiting for resource group $rg deletion..."
            az group wait --name "$rg" --no-wait --timeout 600 || echo "Resource group $rg may have already been deleted or timeout"
          fi
        done
        echo "Azure CLI cleanup completed."
        fi
        terraform destroy -auto-approve \
          -var="location=${{ github.event.inputs.location }}" \
          -var="mongo_vm_size=${{ github.event.inputs.mongo_vm_size }}" \
          -var="aks_vm_size=${{ github.event.inputs.aks_vm_size }}"

    - name: Upload TF State to Release
      if: always() && hashFiles('terraform/terraform.tfstate') != ''
      run: |
        # Create or update a release with the state file
        RELEASE_TAG="tf-state"
        RELEASE_DATA=$(echo '{"tag_name":"tf-state","name":"Terraform State","body":"TF State file for wiz-exercise","target_commitish":"main","draft":false,"prerelease":false}')
        
        # Check if state file exists before uploading
        if [ ! -f terraform/terraform.tfstate ]; then
          echo "No state file to upload"
          echo "Terraform state upload skipped" 
          exit 0
        fi
        
        echo "Found state file, uploading..."
        
        # Try to update existing release first
        EXISTING_RELEASE=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/${{ github.repository }}/releases/tags/$RELEASE_TAG" || true)
        
        RELEASE_EXISTS=$(echo "$EXISTING_RELEASE" | jq -r 'has("id")' 2>/dev/null)
        if [ "$RELEASE_EXISTS" = "true" ]; then
          RELEASE_ID=$(echo "$EXISTING_RELEASE" | jq -r '.id')
          curl -X PATCH -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID" \
            -d "$RELEASE_DATA"
        else
          echo "Creating new release..."
          RELEASE_RESPONSE=$(curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "$RELEASE_DATA")
          echo "Release response: $RELEASE_RESPONSE"
          RELEASE_ID=$(echo "$RELEASE_RESPONSE" | jq -r '.id' 2>/dev/null)
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "Failed to create release"
            echo "Full response: $RELEASE_RESPONSE"
            exit 1
          fi
        fi
        
        # Delete existing asset if any
        ASSET_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets" | jq -r '.[] | select(.name=="terraform.tfstate") | .id' || true)
        if [ -n "$ASSET_ID" ] && [ "$ASSET_ID" != "null" ]; then
          curl -X DELETE -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/$ASSET_ID"
        fi
        
        # Upload state file
        curl -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/octet-stream" \
          "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=terraform.tfstate" \
          -H "Content-Type: application/octet-stream" \
          --data-binary @terraform/terraform.tfstate || true