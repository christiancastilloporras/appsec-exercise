name: Terraform Apply/Destroy

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform Action'
        required: true
        type: choice
        default: 'apply'
        options:
          - apply
          - destroy
      location:
        description: 'Azure Region'
        required: false
        default: 'West US'
      mongo_vm_size:
        description: 'Mongo VM Size (e.g. Standard_D2s_v6, Standard_D4s_v6)'
        required: false
        default: 'Standard_D2s_v6'
      aks_vm_size:
        description: 'AKS Node VM Size (e.g. Standard_D2s_v6, Standard_D4s_v6)'
        required: false
        default: 'Standard_D2s_v6'
      aks_authorized_ips:
        description: 'Comma-separated list of IPs/CIDs to authorize on AKS API server (e.g., 123.45.67.89/32)'
        required: false
        default: ''

permissions:
  contents: read

env:
  RESOURCE_GROUP: appsec-exercise-rg
  TF_VERSION: 1.7.5

jobs:
  terraform:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Set AWS Credentials for RustFS S3 Backend
      run: |
        echo "Setting AWS credentials for RustFS S3 backend"
        echo "AWS_ACCESS_KEY_ID=${RUST_FS_ACCESS}" >> $GITHUB_ENV
        echo "AWS_SECRET_ACCESS_KEY=${RUST_FS_SECRET}" >> $GITHUB_ENV
        echo "AWS_ENDPOINT=${RUST_FS_FQDN}" >> $GITHUB_ENV
      env:
        RUST_FS_ACCESS: ${{ secrets.RUST_FS_ACCESS }}
        RUST_FS_SECRET: ${{ secrets.RUST_FS_SECRET }}
        RUST_FS_FQDN: ${{ secrets.RUST_FS_FQDN }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Configure AWS Credentials
      run: |
        echo "Setting AWS credentials as environment variables"
        echo "AWS_ACCESS_KEY_ID=${RUST_FS_ACCESS}" >> $GITHUB_ENV
        echo "AWS_SECRET_ACCESS_KEY=${RUST_FS_SECRET}" >> $GITHUB_ENV
      env:
        RUST_FS_ACCESS: ${{ secrets.RUST_FS_ACCESS }}
        RUST_FS_SECRET: ${{ secrets.RUST_FS_SECRET }}

    - name: Validate Azure Secrets
      run: |
        for secret_name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_CLIENT_SECRET; do
          if [ -z "${!secret_name}" ]; then
            echo "ERROR: $secret_name secret is not set or empty" >&2
            exit 1
          fi
        done
        echo "All Azure secrets validated"
      env:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

    - name: Validate AWS Credentials for RustFS S3 Backend
      run: |
        for secret_name in RUST_FS_ACCESS RUST_FS_SECRET RUST_FS_FQDN; do
          if [ -z "${!secret_name}" ]; then
            echo "ERROR: $secret_name secret is not set or empty" >&2
            exit 1
          fi
        done
        echo "All RustFS secrets validated"
      env:
        RUST_FS_ACCESS: ${{ secrets.RUST_FS_ACCESS }}
        RUST_FS_SECRET: ${{ secrets.RUST_FS_SECRET }}
        RUST_FS_FQDN: ${{ secrets.RUST_FS_FQDN }}

    - name: Test RustFS S3 Backend Connectivity
      run: |
        echo "Installing awscli for S3 backend connectivity test..."
        pip install --quiet awscli
        echo "Testing S3 connectivity to RustFS at https://$RUST_FS_FQDN ..."
        # Test bucket listing (validates credentials, endpoint, and SigV4 signing)
        # Do NOT use 'set -e' here so we can capture the exit code and report a helpful error
        set +e
        aws --endpoint-url "https://$RUST_FS_FQDN" \
          --region us-east-1 \
          s3 ls "s3://tfstate" 2>&1
        LIST_EXIT=$?
        if [ $LIST_EXIT -ne 0 ]; then
          echo "ERROR: RustFS S3 backend connectivity test failed (exit code: $LIST_EXIT)"
          echo "This means terraform init will also fail. Check:"
          echo "  - RUST_FS_FQDN is correct and reachable"
          echo "  - RUST_FS_ACCESS and RUST_FS_SECRET are valid"
          echo "  - The 'tfstate' bucket exists on the RustFS instance"
          exit 1
        fi
        echo "RustFS S3 backend connectivity test passed. Bucket 'tfstate' is accessible."
      env:
        RUST_FS_ACCESS: ${{ secrets.RUST_FS_ACCESS }}
        RUST_FS_SECRET: ${{ secrets.RUST_FS_SECRET }}
        RUST_FS_FQDN: ${{ secrets.RUST_FS_FQDN }}

    - name: Build creds JSON from separated secrets
      id: build_creds
      env:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      run: |
        cat > "$GITHUB_OUTPUT" <<EOF
        creds_json={"clientId":"${AZURE_CLIENT_ID}","clientSecret":"${AZURE_CLIENT_SECRET}","tenantId":"${AZURE_TENANT_ID}","subscriptionId":"${AZURE_SUBSCRIPTION_ID}","activeDirectoryAppIdUrl":"https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/authorize","activeDirectoryGraphResourceId":"https://graph.windows.net/","activeDirectoryServiceEndpointResourceId":"https://management.azure.com/"}
        EOF

    - name: Configure Azure Credentials
      uses: azure/login@v3
      with:
        creds: ${{ steps.build_creds.outputs.creds_json }}

    - name: Grant RBAC Permission for Role Assignment
      if: github.event.inputs.action == 'apply'
      run: |
        SUB_ID=$(az account show --query "id" -o tsv)
        CLIENT_ID=$(az account show --query "user.name" -o tsv)
        SPN_OBJ_ID=$(az ad sp show --id "$CLIENT_ID" --query "objectId" -o tsv 2>/dev/null || echo "")
        echo "Granting User Access Administrator to SPN (objectId: $SPN_OBJ_ID) at subscription level"
        for attempt in $(seq 1 5); do
          echo "RBAC grant attempt $attempt/5..."
          if az role assignment create --assignee "$SPN_OBJ_ID" --role "User Access Administrator" --scope /subscriptions/$SUB_ID 2>/dev/null; then
            echo "RBAC grant succeeded on attempt $attempt"
            break
          elif az role assignment create --assignee "$SPN_OBJ_ID" --role "Owner" --scope /subscriptions/$SUB_ID 2>/dev/null; then
            echo "RBAC grant succeeded with Owner role on attempt $attempt"
            break
          else
            echo "RBAC grant attempt $attempt failed, retrying in 10s..."
            sleep 10
          fi
        done
      continue-on-error: true
      env:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

    - name: Terraform Init
      run: |
        cd terraform
        terraform init -input=false

    - name: Terraform Apply
      if: github.event.inputs.action == 'apply'
      run: |
        cd terraform
        if [ -n "${{ inputs.aks_authorized_ips }}" ]; then
          IPS=$(echo "${{ inputs.aks_authorized_ips }}" | sed 's/,/" , "/g' | sed 's/^/["/' | sed 's/$/"]/')
        else
          IPS='["177.245.192.41/32"]'
        fi
        terraform apply -auto-approve \
          -var="location=${{ github.event.inputs.location }}" \
          -var="mongo_vm_size=${{ github.event.inputs.mongo_vm_size }}" \
          -var="aks_vm_size=${{ github.event.inputs.aks_vm_size }}" \
          -var="aks_authorized_ip_ranges=$IPS"

    - name: Terraform Destroy
      if: github.event.inputs.action == 'destroy'
      run: |
        cd terraform
        terraform destroy -auto-approve \
          -var="location=${{ github.event.inputs.location }}" \
          -var="mongo_vm_size=${{ github.event.inputs.mongo_vm_size }}" \
          -var="aks_vm_size=${{ github.event.inputs.aks_vm_size }}"

    - name: Save AKS Kubeconfig as Artifact
      if: always() && github.event.inputs.action == 'apply'
      continue-on-error: true
      run: |
        cd terraform
        mkdir -p $RUNNER_TEMP/aks-artifact
        az aks get-credentials \
          --resource-group "$RESOURCE_GROUP" \
          --name "appsec-aks-cluster" \
          --file $RUNNER_TEMP/aks-artifact/kubeconfig \
          --admin \
          --overwrite-existing 2>/dev/null || \
        terraform output -raw aks_kube_config > $RUNNER_TEMP/aks-artifact/kubeconfig 2>/dev/null || \
        echo "Could not retrieve kubeconfig"
      env:
        RESOURCE_GROUP: ${{ env.RESOURCE_GROUP }}

    - name: Upload AKS Kubeconfig Artifact
      if: always() && github.event.inputs.action == 'apply'
      continue-on-error: true
      uses: actions/upload-artifact@v6
      with:
        name: aks-kubeconfig
        path: ${{ runner.temp }}/aks-artifact/kubeconfig
        retention-days: 7

    - name: Cleanup Mongo NSG Temp Rule
      if: always() && github.event.inputs.action == 'apply'
      run: |
        echo "Cleanup: Removing temporary Mongo NSG rule (0.0.0.0/0)..."
        MONGO_NSG=$(az network nsg list --resource-group "$RESOURCE_GROUP" --query "[?contains(name, 'mongo-nsg')].name | [0]" -o tsv 2>/dev/null)
        if [ -n "$MONGO_NSG" ]; then
          az network nsg rule delete --resource-group "$RESOURCE_GROUP" --nsg-name "$MONGO_NSG" --name "Mongo-Runner-Temp" 2>/dev/null || echo "Rule not found."
        fi
      env:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
