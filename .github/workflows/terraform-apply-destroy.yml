name: Terraform Apply/Destroy

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform Action'
        required: true
        type: choice
        default: 'apply'
        options:
          - apply
          - destroy
      location:
        description: 'Azure Region'
        required: false
        default: 'West US'
      mongo_vm_size:
        description: 'Mongo VM Size (e.g. Standard_D2s_v6, Standard_D4s_v6)'
        required: false
        default: 'Standard_D2s_v6'
      aks_vm_size:
        description: 'AKS Node VM Size (e.g. Standard_D2s_v6, Standard_D4s_v6)'
        required: false
        default: 'Standard_D2s_v6'
      aks_authorized_ips:
        description: 'Comma-separated list of IPs/CIDRs to authorize on AKS API server (e.g., 123.45.67.89/32)'
        required: false
        default: ''

# Permissions required for artifact uploads
permissions:
  contents: read

env:
  RESOURCE_GROUP: appsec-exercise-rg
  TF_VERSION: 1.7.5
  TFSTATE_CONTAINER: tfstate

jobs:
  terraform:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ env.TF_VERSION }}
        cli_config_credentials_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Validate Azure Separate Secrets
      run: |
        for secret_name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_CLIENT_SECRET; do
          if [ -z "${!secret_name}" ]; then
            echo "ERROR: $secret_name secret is not set or empty" >&2
            exit 1
          fi
        done
        echo "All Azure login secrets validated"
      env:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

    - name: Build creds JSON from separated secrets
      id: build_creds
      env:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      run: |
        cat > "$GITHUB_OUTPUT" <<EOF
        creds_json={"clientId":"${AZURE_CLIENT_ID}","clientSecret":"${AZURE_CLIENT_SECRET}","tenantId":"${AZURE_TENANT_ID}","subscriptionId":"${AZURE_SUBSCRIPTION_ID}","activeDirectoryAppIdUrl":"https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/authorize","activeDirectoryGraphResourceId":"https://graph.windows.net/","activeDirectoryServiceEndpointResourceId":"https://management.azure.com/"}
        EOF

    - name: Configure Azure Credentials
      uses: azure/login@v3
      with:
        creds: ${{ steps.build_creds.outputs.creds_json }}

    - name: Grant RBAC Permission for Role Assignment
      run: |
        # The service principal needs User Access Administrator at subscription level
        # to create role assignments (e.g., ACR Pull role for AKS).
        # Contributor role does NOT include Microsoft.Authorization/roleAssignments/write
        SUB_ID=$(az account show --query "id" -o tsv)
        CLIENT_ID=$(az account show --query "user.name" -o tsv)
        SPN_OBJ_ID=$(az ad sp show --id "$CLIENT_ID" --query "objectId" -o tsv 2>/dev/null || echo "")
        echo "Granting User Access Administrator to SPN (objectId: $SPN_OBJ_ID) at subscription level"
        az role assignment create --assignee "$SPN_OBJ_ID" --role "User Access Administrator" --scope /subscriptions/$SUB_ID 2>/dev/null || \
        az role assignment create --assignee "$SPN_OBJ_ID" --role "Owner" --scope /subscriptions/$SUB_ID 2>/dev/null || \
        echo "RBAC grant attempted - may already have permission"
      continue-on-error: true

    - name: Download Terraform State (if exists)
      continue-on-error: true
      run: |
        echo "Attempting to download Terraform state from Azure Blob Storage..."
        # Find storage account name from resource group
        TFSTATE_STORAGE_ACCOUNT=$(az storage account list \
          --resource-group "$RESOURCE_GROUP" \
          --query "[?contains(name, 'appsecbackup')].name | [0]" -o tsv 2>/dev/null)
        if [ -n "$TFSTATE_STORAGE_ACCOUNT" ]; then
          echo "Found storage account: $TFSTATE_STORAGE_ACCOUNT"
          python3 scripts/download_tfstate.py "$TFSTATE_STORAGE_ACCOUNT" "${TFSTATE_CONTAINER}" "$RESOURCE_GROUP"
        else
          echo "No storage account found in resource group $RESOURCE_GROUP"
        fi
        if [ -f terraform/terraform.tfstate ]; then
          echo "State file found: $(wc -c < terraform/terraform.tfstate) bytes"
        else
          echo "No state file downloaded - will use Azure CLI cleanup as fallback"
        fi

    - name: Terraform Init
      run: |
        cd terraform
        terraform init -input=false

    - name: Terraform Apply
      if: github.event.inputs.action == 'apply'
      run: |
        cd terraform
        # Convert comma-separated AKS authorized IPs to Terraform list format
        if [ -n "${{ inputs.aks_authorized_ips }}" ]; then
          AKS_IPS=$(echo "${{ inputs.aks_authorized_ips }}" | sed 's/,/", "/g' | sed 's/^/["/' | sed 's/$/"]/')
        else
          # Fall back to default from variables.tf (must include at least one IP to enable feature)
          AKS_IPS='["177.245.192.41/32"]'
        fi
        terraform apply -auto-approve \
          -var="location=${{ github.event.inputs.location }}" \
          -var="mongo_vm_size=${{ github.event.inputs.mongo_vm_size }}" \
          -var="aks_vm_size=${{ github.event.inputs.aks_vm_size }}" \
          -var="aks_authorized_ip_ranges=$AKS_IPS" || true
      continue-on-error: true

    - name: Save AKS Kubeconfig as Artifact
      if: always() && github.event.inputs.action == 'apply'
      continue-on-error: true
      run: |
        cd terraform
        mkdir -p $RUNNER_TEMP/aks-artifact
        # Generate fresh kubeconfig from AKS cluster
        az aks get-credentials \
          --resource-group "$RESOURCE_GROUP" \
          --name "appsec-aks-cluster" \
          --file $RUNNER_TEMP/aks-artifact/kubeconfig \
          --admin \
          --overwrite-existing 2>/dev/null || \
        # If that fails, try getting it from terraform output
        terraform output -raw aks_kube_config > $RUNNER_TEMP/aks-artifact/kubeconfig 2>/dev/null || \
        echo "Could not retrieve kubeconfig"
        ls -la $RUNNER_TEMP/aks-artifact/
        echo "Kubeconfig saved to artifact"
      env:
        RESOURCE_GROUP: ${{ env.RESOURCE_GROUP }}

    - name: Upload AKS Kubeconfig Artifact
      if: always() && github.event.inputs.action == 'apply'
      continue-on-error: true
      uses: actions/upload-artifact@v6
      with:
        name: aks-kubeconfig
        path: ${{ runner.temp }}/aks-artifact/kubeconfig
        retention-days: 7

    - name: Copy State for Upload
      if: always() && github.event.inputs.action == 'apply'
      run: |
        cd terraform
        # terraform.tfstate contains the state from the apply attempt
        # Even if apply failed partway, the state file has resources that were created
        ls -la terraform.tfstate 2>/dev/null || echo "No state file"

    - name: Terraform Destroy
      if: github.event.inputs.action == 'destroy'
      run: |
        cd terraform
        # Check if state file exists
        if [ ! -f terraform.tfstate ]; then
          echo "No state file found. Resources may have been partially created."
          echo "Attempting Azure CLI cleanup..."
          # List all resource groups matching the naming pattern
          az group list --query "[?contains(name, 'appsec-exercise')].name" -o tsv | while read rg; do
          if [ -n "$rg" ]; then
            echo "Deleting resource group: $rg"
            az group delete --name "$rg" --yes --no-wait
          fi
        done
        echo "Azure CLI cleanup initiated. Waiting for deletion to complete..."
        for rg in $(az group list --query "[?contains(name, 'appsec-exercise')].name" -o tsv); do
          if [ -n "$rg" ]; then
            echo "Waiting for resource group $rg deletion..."
            az group wait --name "$rg" --deleted --timeout 600 || echo "Resource group $rg may have already been deleted or timeout"
          fi
        done
        echo "Azure CLI cleanup completed."
        fi
        terraform destroy -auto-approve \
          -var="location=${{ github.event.inputs.location }}" \
          -var="mongo_vm_size=${{ github.event.inputs.mongo_vm_size }}" \
          -var="aks_vm_size=${{ github.event.inputs.aks_vm_size }}"

    - name: Upload TF State to Azure Blob Storage
      if: always() && github.event.inputs.action == 'apply' && hashFiles('terraform/terraform.tfstate') != ''
      run: |
        set -e
        if [ ! -f terraform/terraform.tfstate ]; then
          echo "No state file to upload"
          exit 0
        fi

        echo "Found state file, uploading to Azure Blob Storage..."
        STATE_FILE="terraform/terraform.tfstate"

        # Upload using service principal auth via Azure CLI login
        TFSTATE_STORAGE_ACCOUNT=$(cd terraform && terraform output -raw storage_account_name 2>/dev/null)

        if [ -z "$TFSTATE_STORAGE_ACCOUNT" ]; then
          echo "ERROR: Could not get storage account name from terraform output"
          exit 1
        fi

        echo "Uploading to storage account: $TFSTATE_STORAGE_ACCOUNT"
        # Fetch storage account key (works with subscription-level Contributor role)
        TFSTATE_STORAGE_KEY=$(az storage account keys list \
          --account-name "$TFSTATE_STORAGE_ACCOUNT" \
          --resource-group "$RESOURCE_GROUP" \
          --query "[0].value" -o tsv 2>/dev/null)
        if [ -z "$TFSTATE_STORAGE_KEY" ]; then
          echo "ERROR: Could not get storage account key"
          exit 1
        fi

        # Get runner IP and add to storage account network rules
        # (storage account has public_network_access_enabled=false with default_action=Deny)
        RUNNER_IP=$(curl -s https://api.ipify.org)
        if [ -n "$RUNNER_IP" ]; then
          echo "Runner IP: $RUNNER_IP"
          echo "Adding runner IP to storage account network rules..."
          az storage account network-rule add \
            --account-name "$TFSTATE_STORAGE_ACCOUNT" \
            --resource-group "$RESOURCE_GROUP" \
            --ip "$RUNNER_IP" 2>/dev/null || echo "Network rule may already exist"
          # Wait for rule to propagate
          sleep 5
        fi

        az storage blob upload \
          --account-name "$TFSTATE_STORAGE_ACCOUNT" \
          --account-key "$TFSTATE_STORAGE_KEY" \
          --container-name "${TFSTATE_CONTAINER}" \
          --name "terraform.tfstate" \
          --file "$STATE_FILE" \
          --auth-mode key \
          --overwrite

        echo "TF state uploaded to Azure Blob Storage successfully"

        # Clean up: remove the runner IP from network rules
        if [ -n "$RUNNER_IP" ]; then
          echo "Cleaning up: removing runner IP from storage account network rules..."
          az storage account network-rule remove \
            --account-name "$TFSTATE_STORAGE_ACCOUNT" \
            --resource-group "$RESOURCE_GROUP" \
            --ip "$RUNNER_IP" 2>/dev/null || echo "Cleanup: network rule may have already been removed"
        fi
