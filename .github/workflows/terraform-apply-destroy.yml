name: Terraform Apply/Destroy

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform Action'
        required: true
        type: choice
        default: 'apply'
        options:
          - apply
          - destroy
      location:
        description: 'Azure Region'
        required: false
        default: 'West US'
      mongo_vm_size:
        description: 'Mongo VM Size (e.g. Standard_D2s_v6, Standard_D4s_v6)'
        required: false
        default: 'Standard_D2s_v6'
      aks_vm_size:
        description: 'AKS Node VM Size (e.g. Standard_D2s_v6, Standard_D4s_v6)'
        required: false
        default: 'Standard_D2s_v6'
      aks_authorized_ips:
        description: 'Comma-separated list of IPs/CIDs to authorize on AKS API server (e.g., 123.45.67.89/32)'
        required: false
        default: ''

permissions:
  contents: read

env:
  RESOURCE_GROUP: appsec-exercise-rg
  TF_VERSION: 1.7.5

jobs:
  terraform:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ env.TF_VERSION }}
        cli_config_credentials_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Validate Secrets
      run: |
        for secret_name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_CLIENT_SECRET TFC_TEAM_TOKEN TFC_ORG_NAME; do
          if [ -z "${!secret_name}" ]; then
            echo "ERROR: $secret_name secret is not set or empty" >&2
            exit 1
          fi
        done
        echo "All secrets validated (Azure + TFC)"
      env:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        TFC_TEAM_TOKEN: ${{ secrets.TFC_TEAM_TOKEN }}
        TFC_ORG_NAME: ${{ secrets.TFC_ORG_NAME }}

    - name: Build creds JSON from separated secrets
      id: build_creds
      env:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      run: |
        cat > "$GITHUB_OUTPUT" <<EOF
        creds_json={"clientId":"${AZURE_CLIENT_ID}","clientSecret":"${AZURE_CLIENT_SECRET}","tenantId":"${AZURE_TENANT_ID}","subscriptionId":"${AZURE_SUBSCRIPTION_ID}","activeDirectoryAppIdUrl":"https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/authorize","activeDirectoryGraphResourceId":"https://graph.windows.net/","activeDirectoryServiceEndpointResourceId":"https://management.azure.com/"}
        EOF

    - name: Configure Azure Credentials
      uses: azure/login@v3
      with:
        creds: ${{ steps.build_creds.outputs.creds_json }}

    - name: Grant RBAC Permission for Role Assignment
      if: github.event.inputs.action == 'apply'
      run: |
        SUB_ID=$(az account show --query "id" -o tsv)
        CLIENT_ID=$(az account show --query "user.name" -o tsv)
        SPN_OBJ_ID=$(az ad sp show --id "$CLIENT_ID" --query "objectId" -o tsv 2>/dev/null || echo "")
        echo "Granting User Access Administrator to SPN (objectId: $SPN_OBJ_ID) at subscription level"
        for attempt in $(seq 1 5); do
          echo "RBAC grant attempt $attempt/5..."
          if az role assignment create --assignee "$SPN_OBJ_ID" --role "User Access Administrator" --scope /subscriptions/$SUB_ID 2>/dev/null; then
            echo "RBAC grant succeeded on attempt $attempt"
            break
          elif az role assignment create --assignee "$SPN_OBJ_ID" --role "Owner" --scope /subscriptions/$SUB_ID 2>/dev/null; then
            echo "RBAC grant succeeded with Owner role on attempt $attempt"
            break
          else
            echo "RBAC grant attempt $attempt failed, retrying in 10s..."
            sleep 10
          fi
        done
        echo "RBAC grant step completed"
      continue-on-error: true
      env:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

    - name: Write Terraform Variables File
      run: |
        cd terraform
        if [ -n "${{ inputs.aks_authorized_ips }}" ]; then
          AKS_IPS=$(echo "${{ inputs.aks_authorized_ips }}" | sed 's/,/", "/g' | sed 's/^/["/' | sed 's/$/"]/')
        else
          AKS_IPS='["177.245.192.41/32"]'
        fi
        cat > github-actions.auto.tfvars <<EOF
        location = "${{ github.event.inputs.location }}"
        mongo_vm_size = "${{ github.event.inputs.mongo_vm_size }}"
        aks_vm_size = "${{ github.event.inputs.aks_vm_size }}"
        aks_authorized_ip_ranges = $AKS_IPS
        EOF
      env:
        TFC_TEAM_TOKEN: ${{ secrets.TFC_TEAM_TOKEN }}
        TFC_ORG_NAME: ${{ secrets.TFC_ORG_NAME }}

    - name: Configure TFC Authentication
      run: |
        mkdir -p $HOME/.terraform.d
        cat > $HOME/.terraform.d/credentials.tfrc.json <<EOF
        {
          "credentials": {
            "app.terraform.io": {
              "token": "${TFC_TEAM_TOKEN}"
            }
          }
        }
        EOF
      env:
        TFC_TEAM_TOKEN: ${{ secrets.TFC_TEAM_TOKEN }}

    - name: Terraform Init
      run: |
        cd terraform
        # The remote backend's organization can't use variables, so we pass it via -backend-config
        # The TF_TOKEN_app_terraform_io env var or credentials.tfrc.json handles auth
        terraform init -input=false -reconfigure \
          -backend-config="organization=${TFC_ORG_NAME}"
      env:
        TFC_TEAM_TOKEN: ${{ secrets.TFC_TEAM_TOKEN }}
        TFC_ORG_NAME: ${{ secrets.TFC_ORG_NAME }}

    - name: Terraform Apply
      if: github.event.inputs.action == 'apply'
      run: |
        cd terraform
        terraform apply -auto-approve

    - name: Save AKS Kubeconfig as Artifact
      if: always() && github.event.inputs.action == 'apply'
      continue-on-error: true
      run: |
        cd terraform
        mkdir -p $RUNNER_TEMP/aks-artifact
        az aks get-credentials \
          --resource-group "$RESOURCE_GROUP" \
          --name "appsec-aks-cluster" \
          --file $RUNNER_TEMP/aks-artifact/kubeconfig \
          --admin \
          --overwrite-existing 2>/dev/null || \
        terraform output -raw aks_kube_config > $RUNNER_TEMP/aks-artifact/kubeconfig 2>/dev/null || \
        echo "Could not retrieve kubeconfig"
        ls -la $RUNNER_TEMP/aks-artifact/
        echo "Kubeconfig saved to artifact"
      env:
        RESOURCE_GROUP: ${{ env.RESOURCE_GROUP }}

    - name: Upload AKS Kubeconfig Artifact
      if: always() && github.event.inputs.action == 'apply'
      continue-on-error: true
      uses: actions/upload-artifact@v6
      with:
        name: aks-kubeconfig
        path: ${{ runner.temp }}/aks-artifact/kubeconfig
        retention-days: 7

    - name: Cleanup Mongo NSG Temp Rule
      if: always() && github.event.inputs.action == 'apply'
      run: |
        echo "Cleanup: Removing temporary Mongo NSG rule (0.0.0.0/0) to ensure security..."
        MONGO_NSG=$(az network nsg list --resource-group "$RESOURCE_GROUP" --query "[?contains(name, 'mongo-nsg')].name | [0]" -o tsv 2>/dev/null)
        if [ -n "$MONGO_NSG" ]; then
          echo "Found Mongo NSG: $MONGO_NSG. Deleting rule 'Mongo-Runner-Temp'..."
          az network nsg rule delete --resource-group "$RESOURCE_GROUP" --nsg-name "$MONGO_NSG" --name "Mongo-Runner-Temp" 2>/dev/null || echo "Rule 'Mongo-Runner-Temp' already removed or not found."
          echo "Cleanup completed. Only Mongo-AKS-Only rule remains (AKS subnet CIDR)."
        else
          echo "Could not find Mongo NSG. Skipping rule deletion."
        fi
      env:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

    - name: Terraform Destroy
      if: github.event.inputs.action == 'destroy'
      run: |
        cd terraform
        terraform destroy -auto-approve
      env:
        TFC_TEAM_TOKEN: ${{ secrets.TFC_TEAM_TOKEN }}
        TFC_ORG_NAME: ${{ secrets.TFC_ORG_NAME }}
