name: Terraform Apply/Destroy

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform Action'
        required: true
        type: choice
        default: 'apply'
        options:
          - apply
          - destroy
      location:
        description: 'Azure Region'
        required: false
        default: 'West US'
      mongo_vm_size:
        description: 'Mongo VM Size (e.g. Standard_D2s_v6, Standard_D4s_v6)'
        required: false
        default: 'Standard_D2s_v6'
      aks_vm_size:
        description: 'AKS Node VM Size (e.g. Standard_D2s_v6, Standard_D4s_v6)'
        required: false
        default: 'Standard_D2s_v6'
      aks_authorized_ips:
        description: 'Comma-separated list of IPs/CIDs to authorize on AKS API server (e.g., 123.45.67.89/32)'
        required: false
        default: ''

permissions:
  contents: read

env:
  RESOURCE_GROUP: appsec-exercise-rg
  TF_VERSION: 1.7.5
  TFC_WORKSPACE: "appsec-exercise"

jobs:
  terraform:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Validate Secrets
      run: |
        for secret_name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_CLIENT_SECRET TFC_TEAM_TOKEN TFC_ORG_NAME; do
          if [ -z "${!secret_name}" ]; then
            echo "ERROR: $secret_name secret is not set or empty" >&2
            exit 1
          fi
        done
        echo "All secrets validated (Azure + TFC)"
      env:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        TFC_TEAM_TOKEN: ${{ secrets.TFC_TEAM_TOKEN }}
        TFC_ORG_NAME: ${{ secrets.TFC_ORG_NAME }}

    - name: Build creds JSON from separated secrets
      id: build_creds
      env:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      run: |
        cat > "$GITHUB_OUTPUT" <<EOF
        creds_json={"clientId":"${AZURE_CLIENT_ID}","clientSecret":"${AZURE_CLIENT_SECRET}","tenantId":"${AZURE_TENANT_ID}","subscriptionId":"${AZURE_SUBSCRIPTION_ID}","activeDirectoryAppIdUrl":"https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/authorize","activeDirectoryGraphResourceId":"https://graph.windows.net/","activeDirectoryServiceEndpointResourceId":"https://management.azure.com/"}
        EOF

    - name: Configure Azure Credentials
      uses: azure/login@v3
      with:
        creds: ${{ steps.build_creds.outputs.creds_json }}

    - name: Grant RBAC Permission for Role Assignment
      if: github.event.inputs.action == 'apply'
      run: |
        SUB_ID=$(az account show --query "id" -o tsv)
        CLIENT_ID=$(az account show --query "user.name" -o tsv)
        SPN_OBJ_ID=$(az ad sp show --id "$CLIENT_ID" --query "objectId" -o tsv 2>/dev/null || echo "")
        echo "Granting User Access Administrator to SPN (objectId: $SPN_OBJ_ID) at subscription level"
        for attempt in $(seq 1 5); do
          echo "RBAC grant attempt $attempt/5..."
          if az role assignment create --assignee "$SPN_OBJ_ID" --role "User Access Administrator" --scope /subscriptions/$SUB_ID 2>/dev/null; then
            echo "RBAC grant succeeded on attempt $attempt"
            break
          elif az role assignment create --assignee "$SPN_OBJ_ID" --role "Owner" --scope /subscriptions/$SUB_ID 2>/dev/null; then
            echo "RBAC grant succeeded with Owner role on attempt $attempt"
            break
          else
            echo "RBAC grant attempt $attempt failed, retrying in 10s..."
            sleep 10
          fi
        done
      continue-on-error: true
      env:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

    - name: Sync State FROM Terraform Cloud
      run: |
        cd terraform
        echo "Pulling current state from TFC..."
        # 1. Get current state version
        STATE_JSON=$(curl -s -H "Authorization: Bearer ${TFC_TOKEN}" \
          "https://app.terraform.io/api/v2/organizations/${TFC_ORG}/workspaces/${TFC_WORKSPACE}/current-state-version")
        
        DOWNLOAD_URL=$(echo $STATE_JSON | jq -r '.data.attributes."hosted-state-download-url"')
        
        if [ "$DOWNLOAD_URL" != "null" ] && [ -n "$DOWNLOAD_URL" ]; then
          echo "Downloading state from $DOWNLOAD_URL"
          curl -s -H "Authorization: Bearer ${TFC_TOKEN}" -L "$DOWNLOAD_URL" -o terraform.tfstate
          echo "State pulled successfully."
        else
          echo "No state found in TFC (new workspace or empty state). Starting fresh."
          touch terraform.tfstate
        fi
      env:
        TFC_TOKEN: ${{ secrets.TFC_TEAM_TOKEN }}
        TFC_ORG: ${{ secrets.TFC_ORG_NAME }}

    - name: Terraform Init
      run: |
        cd terraform
        terraform init -input=false

    - name: Terraform Apply
      if: github.event.inputs.action == 'apply'
      run: |
        cd terraform
        if [ -n "${{ inputs.aks_authorized_ips }}" ]; then
          IPS=$(echo "${{ inputs.aks_authorized_ips }}" | sed 's/,/" , "/g' | sed 's/^/["/' | sed 's/$/"]/')
        else
          IPS='["177.245.192.41/32"]'
        fi
        terraform apply -auto-approve \
          -var="location=${{ github.event.inputs.location }}" \
          -var="mongo_vm_size=${{ github.event.inputs.mongo_vm_size }}" \
          -var="aks_vm_size=${{ github.event.inputs.aks_vm_size }}" \
          -var="aks_authorized_ip_ranges=$IPS"

    - name: Terraform Destroy
      if: github.event.inputs.action == 'destroy'
      run: |
        cd terraform
        terraform destroy -auto-approve \
          -var="location=${{ github.event.inputs.location }}" \
          -var="mongo_vm_size=${{ github.event.inputs.mongo_vm_size }}" \
          -var="aks_vm_size=${{ github.event.inputs.aks_vm_size }}"

    - name: Sync State TO Terraform Cloud
      if: always()
      run: |
        cd terraform
        echo "Pushing updated state to TFC..."
        # 1. Request an upload URL
        UPLOAD_JSON=$(curl -s -X POST -H "Authorization: Bearer ${TFC_TOKEN}" \
          -H "Content-Type: application/vnd.api+json" \
          -d '{"data":{"type":"state-versions","attributes":{"uploaded_at":"'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"}}}' \
          "https://app.terraform.io/api/v2/organizations/${TFC_ORG}/workspaces/${TFC_WORKSPACE}/state-versions")
        
        UPLOAD_URL=$(echo $UPLOAD_JSON | jq -r '.data.attributes."hosted-state-upload-url"')
        
        if [ "$UPLOAD_URL" != "null" ] && [ -n "$UPLOAD_URL" ]; then
          echo "Uploading state to $UPLOAD_URL"
          curl -s -X PUT -H "Content-Type: application/octet-stream" \
            -H "Authorization: Bearer ${TFC_TOKEN}" \
            --data-binary @terraform.tfstate "$UPLOAD_URL"
          echo "State pushed successfully."
        else
          echo "ERROR: Could not obtain upload URL from TFC API. State not saved!"
          exit 1
        fi
      env:
        TFC_TOKEN: ${{ secrets.TFC_TEAM_TOKEN }}
        TFC_ORG: ${{ secrets.TFC_ORG_NAME }}

    - name: Save AKS Kubeconfig as Artifact
      if: always() && github.event.inputs.action == 'apply'
      continue-on-error: true
      run: |
        cd terraform
        mkdir -p $RUNNER_TEMP/aks-artifact
        az aks get-credentials \
          --resource-group "$RESOURCE_GROUP" \
          --name "appsec-aks-cluster" \
          --file $RUNNER_TEMP/aks-artifact/kubeconfig \
          --admin \
          --overwrite-existing 2>/dev/null || \
        terraform output -raw aks_kube_config > $RUNNER_TEMP/aks-artifact/kubeconfig 2>/dev/null || \
        echo "Could not retrieve kubeconfig"
      env:
        RESOURCE_GROUP: ${{ env.RESOURCE_GROUP }}

    - name: Upload AKS Kubeconfig Artifact
      if: always() && github.event.inputs.action == 'apply'
      continue-on-error: true
      uses: actions/upload-artifact@v6
      with:
        name: aks-kubeconfig
        path: ${{ runner.temp }}/aks-artifact/kubeconfig
        retention-days: 7

    - name: Cleanup Mongo NSG Temp Rule
      if: always() && github.event.inputs.action == 'apply'
      run: |
        echo "Cleanup: Removing temporary Mongo NSG rule (0.0.0.0/0)..."
        MONGO_NSG=$(az network nsg list --resource-group "$RESOURCE_GROUP" --query "[?contains(name, 'mongo-nsg')].name | [0]" -o tsv 2>/dev/null)
        if [ -n "$MONGO_NSG" ]; then
          az network nsg rule delete --resource-group "$RESOURCE_GROUP" --nsg-name "$MONGO_NSG" --name "Mongo-Runner-Temp" 2>/dev/null || echo "Rule not found."
        fi
      env:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
