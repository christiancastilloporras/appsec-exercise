apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiz-exercise-app
  labels:
    app: wiz-exercise-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wiz-exercise-app
  template:
    metadata:
      labels:
        app: wiz-exercise-app
    spec:
      serviceAccount: wiz-exercise-sa
      serviceAccountName: wiz-exercise-sa
      initContainers:
      - name: init-mongo
        image: python:3.11-slim
        command:
        - /bin/sh
        - -c
        - |
          echo "Installing pymongo..."
          pip install --no-cache-dir pymongo==3.13.0 werkzeug==2.3.7 2>&1
          echo "Waiting for MongoDB at ${MONGO_URI}..."
          until python3 -c "from pymongo import MongoClient; import os; c=MongoClient(os.environ['MONGO_URI']); c.server_info(); print('MongoDB ready')" 2>/dev/null
          do
            echo "MongoDB not ready, retrying in 5s..."
            sleep 5
          done
          echo "MongoDB is ready, seeding database..."
          python3 /seed/seed_db.py
        env:
        - name: MONGO_URI
          valueFrom:
            configMapKeyRef:
              name: wiz-app-config
              key: MONGO_URI
        volumeMounts:
        - name: seed-script
          mountPath: /seed
      volumes:
      - name: seed-script
        configMap:
          name: seed-script
      containers:
      - name: wiz-app
        # Image updated by CI pipeline via sed
        image: PLACEHOLDER_ACR.azurecr.io/wiz-exercise:PLACEHOLDER_TAG
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: wiz-app-config
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: wiz-app-secrets
              key: secret_key
        imagePullPolicy: Always
      imagePullSecrets:
      - name: acr-secret
