apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wiz-exercise-ingress
  annotations:
    # HTTP→HTTPS redirect handled by Cloudflare; NGINX SSL redirect not needed
    # because Cloudflare terminates SSL at the edge and connects via HTTP
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  rules:
  - host: app.cloudguardian.xyz
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wiz-exercise-service
            port:
              number: 80
  # Catch-all for any hostname/IP - allows debugging via bare LB IP
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wiz-exercise-service
            port:
              number: 80
