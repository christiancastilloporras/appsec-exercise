apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wiz-exercise-ingress
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "false"
spec:
  # AKS HTTP Application Routing uses the 'addon-http-application-routing' ingress class
  ingressClassName: addon-http-application-routing
  rules:
  - host: wiz-exercise.westeurope.cloudapp.azure.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wiz-exercise-service
            port:
              number: 80