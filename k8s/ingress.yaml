apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wiz-exercise-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: webapprouting
  tls:
  - hosts:
    - app.cloudguardian.xyz
    secretName: tls-origin-cert
  rules:
  - host: app.cloudguardian.xyz
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wiz-exercise-service
            port:
              number: 80