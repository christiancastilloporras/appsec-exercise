apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wiz-exercise-ingress
  annotations:
    # Redirect HTTP to HTTPS (handled by Cloudflare + Ingress controller)
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: webapprouting.kubernetesazure.com
  tls:
  - hosts:
    - app.cloudguardian.xyz
    secretName: tls-origin-cert
  rules:
  - host: app.cloudguardian.xyz
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wiz-exercise-service
            port:
              number: 80
  # Catch-all for any hostname/IP - allows debugging via bare LB IP
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wiz-exercise-service
            port:
              number: 80
