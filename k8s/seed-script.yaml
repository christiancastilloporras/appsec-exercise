apiVersion: v1
kind: ConfigMap
metadata:
  name: seed-script
data:
  seed_db.py: |
    #!/usr/bin/env python3
    """Seed script to create admin user in MongoDB

    This script connects with authentication and creates the application's admin
    user (separate from the MongoDB admin user). The MongoDB admin user is created
    by the cloud-init startup script (start-mongod.sh) during VM provisioning.
    """
    from pymongo import MongoClient
    from werkzeug.security import generate_password_hash
    import os

    # Read connection details from environment variables
    MONGO_IP = os.environ.get('MONGO_IP', 'localhost')
    MONGO_ADMIN_PASSWORD = os.environ.get('MONGO_ADMIN_PASSWORD', 'admin123')
    MONGO_URI = os.environ.get('MONGO_URI', f'mongodb://admin:{MONGO_ADMIN_PASSWORD}@{MONGO_IP}:27017/admin-app?authSource=admin')

    # Connect with authentication
    client = MongoClient(MONGO_URI)
    db = client['admin-app']
    users = db['users']

    # Authenticate and create app admin user if not exists
    admin_user = users.find_one({'username': 'admin'})
    if not admin_user:
        users.insert_one({
            'username': 'admin',
            'password': generate_password_hash('admin123')
        })
        print("Admin user created: admin / admin123")
    else:
        print("Admin user already exists")

    # MongoDB authentication is now enabled (authSource=admin)
    print("MongoDB setup complete - authentication required for all connections")
